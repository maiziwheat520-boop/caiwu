[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ledgerbridge"
version = "0.1.0"
description = "Self-hosted financial ledger gateway"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "cryptography>=50,<51",
  "fastapi>=0.115,<1",
  "pynacl>=1.6.2,<2",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
  "xlrd>=2.0.2,<3",
]

[project.optional-dependencies]
ocr = [
  "onnxruntime==1.29.0",
  "openpyxl==3.1.5",
  "rapidocr==3.9.2",
]
dev = [
  "bandit[toml]>=1.8,<2",
  "httpx>=0.28,<1",
  "hypothesis>=6.120,<7",
  "mypy>=1.14,<2",
  "pip-audit>=2.7,<3",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.3,<2",
  "pytest-cov>=6,<7",
  "pyyaml>=6.0,<7",
  "ruff>=0.9,<1",
  "types-pyyaml>=6.0,<7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ledgerbridge = ["synthetic_read_data/*"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["docs/reviews/2026-08-22-phase-2-evidence-import-claude.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["ledgerbridge"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.bandit]
exclude_dirs = ["tests"]
skips = []
[tool.coverage.run]
omit = ["src/ledgerbridge/mail_collector.py"]

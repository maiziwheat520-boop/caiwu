services:
  internal-socket-init:
    image: ledgerbridge-app:${LEDGERBRIDGE_REVISION:?review image revision is required}
    user: "0:0"
    command:
      - /bin/sh
      - -ec
      - chown 0:0 /run/ledgerbridge-internal /run/ledgerbridge-unlocker; chmod 0770 /run/ledgerbridge-internal; chmod 0700 /run/ledgerbridge-unlocker; chown 10001:10001 /run/ledgerbridge-internal /run/ledgerbridge-unlocker
    restart: "no"
    read_only: true
    network_mode: none
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    volumes:
      - internal-read-socket:/run/ledgerbridge-internal
      - evidence-unlock-socket:/run/ledgerbridge-unlocker

  internal-reader:
    image: ledgerbridge-app:${LEDGERBRIDGE_REVISION:?review image revision is required}
    command: ["/app/docker/run-internal-reader.sh"]
    environment:
      LEDGERBRIDGE_ENV: production
      LEDGERBRIDGE_LOG_LEVEL: ${LEDGERBRIDGE_LOG_LEVEL:-INFO}
      LEDGERBRIDGE_RUNTIME_ROLE: api
      LEDGERBRIDGE_API_DATABASE_URL: ${LEDGERBRIDGE_API_DATABASE_URL:?api database URL is required}
      LEDGERBRIDGE_READER_DATABASE_URL: ${LEDGERBRIDGE_READER_DATABASE_URL:?reader database URL is required}
      LEDGERBRIDGE_ARTIFACT_ROOT: /var/lib/ledgerbridge/artifacts
      LEDGERBRIDGE_ARTIFACT_MAX_BYTES: ${LEDGERBRIDGE_ARTIFACT_MAX_BYTES:-52428800}
      LEDGERBRIDGE_ARTIFACT_TOTAL_MAX_BYTES: ${LEDGERBRIDGE_ARTIFACT_TOTAL_MAX_BYTES:-10737418240}
      LEDGERBRIDGE_ARTIFACT_STAGING_MAX_BYTES: ${LEDGERBRIDGE_ARTIFACT_STAGING_MAX_BYTES:-536870912}
      LEDGERBRIDGE_ARTIFACT_STAGING_TTL_SECONDS: ${LEDGERBRIDGE_ARTIFACT_STAGING_TTL_SECONDS:-3600}
      LEDGERBRIDGE_ENABLE_INTERNAL_UPLOAD: "false"
      LEDGERBRIDGE_ENABLE_REVIEW_API: "false"
      LEDGERBRIDGE_ENABLE_REAL_INGEST: "false"
      LEDGERBRIDGE_ENABLE_INTERNAL_READ_API: "true"
      LEDGERBRIDGE_INTERNAL_READ_BACKEND: database
      LEDGERBRIDGE_INTERNAL_READ_CURSOR_KEY: ${LEDGERBRIDGE_INTERNAL_READ_CURSOR_KEY:?cursor key is required}
      LEDGERBRIDGE_INTERNAL_READ_EVIDENCE_KEY_FILE: /run/ledgerbridge-key/evidence-key.json
      LEDGERBRIDGE_ENABLE_INTERNAL_READ_PERSISTENT_AUDIT: "true"
      LEDGERBRIDGE_ENABLE_INTERNAL_READ_PERSISTENT_RECEIPT: "true"
      LEDGERBRIDGE_INTERNAL_READ_OPERATIONAL_GATE: r1-production-v1
      LEDGERBRIDGE_INTERNAL_READ_TRANSPORT: unix-mtls-proxy
      LEDGERBRIDGE_INTERNAL_READ_MTLS_POLICY_PATH: /run/ledgerbridge-policy/policy.json
      LEDGERBRIDGE_INTERNAL_READ_POLICY_GENERATION: ${LEDGERBRIDGE_INTERNAL_READ_POLICY_GENERATION:?policy generation is required}
      LEDGERBRIDGE_ORIGINAL_RECONCILIATION_LAYOUT_FILE: /run/ledgerbridge-private/original-reconciliation-layout.json
      LEDGERBRIDGE_ORIGINAL_RECONCILIATION_LAYOUT_SHA256: ${LEDGERBRIDGE_ORIGINAL_RECONCILIATION_LAYOUT_SHA256:?reviewed original-reconciliation layout digest is required}
      LEDGERBRIDGE_ENABLE_INTERNAL_CANDIDATE_COMMAND_API: "true"
      LEDGERBRIDGE_INTERNAL_CANDIDATE_COMMAND_BACKEND: database
      LEDGERBRIDGE_INTERNAL_CANDIDATE_COMMAND_OPERATIONAL_GATE: d1-production-v1
      LEDGERBRIDGE_INTERNAL_COMMAND_ASSERTION_KEY: ${LEDGERBRIDGE_INTERNAL_COMMAND_ASSERTION_KEY:?assertion key is required}
      LEDGERBRIDGE_INTERNAL_COMMAND_ASSERTION_ISSUER: ${LEDGERBRIDGE_INTERNAL_COMMAND_ASSERTION_ISSUER:?assertion issuer is required}
      LEDGERBRIDGE_INTERNAL_COMMAND_ASSERTION_AUDIENCE: ${LEDGERBRIDGE_INTERNAL_COMMAND_ASSERTION_AUDIENCE:?assertion audience is required}
      LEDGERBRIDGE_ENABLE_INTERNAL_EVIDENCE_UNLOCK: ${LEDGERBRIDGE_ENABLE_INTERNAL_EVIDENCE_UNLOCK:-false}
      LEDGERBRIDGE_INTERNAL_EVIDENCE_UNLOCK_BACKEND: database
      LEDGERBRIDGE_INTERNAL_EVIDENCE_UNLOCK_OPERATIONAL_GATE: ${LEDGERBRIDGE_INTERNAL_EVIDENCE_UNLOCK_OPERATIONAL_GATE:-closed}
      LEDGERBRIDGE_INTERNAL_EVIDENCE_UNLOCK_TRANSPORT: unix-socket
      LEDGERBRIDGE_INTERNAL_EVIDENCE_UNLOCK_SOCKET_PATH: /run/ledgerbridge-unlocker/evidence-unlocker.sock
      LEDGERBRIDGE_INTERNAL_EVIDENCE_UNLOCK_TIMEOUT_SECONDS: ${LEDGERBRIDGE_INTERNAL_EVIDENCE_UNLOCK_TIMEOUT_SECONDS:-30}
      # Payroll is part of the production Core review surface. Keep this block
      # in the base review stack so a routine Core rebuild cannot silently
      # disable the routes by omitting an optional Compose override.
      LEDGERBRIDGE_ENABLE_PAYROLL_INTEGRATION: "true"
      LEDGERBRIDGE_PAYROLL_BASE_URL: ${LEDGERBRIDGE_PAYROLL_BASE_URL:-http://payroll-verification:4318}
      LEDGERBRIDGE_PAYROLL_TIMEOUT_SECONDS: ${LEDGERBRIDGE_PAYROLL_TIMEOUT_SECONDS:-5}
      LEDGERBRIDGE_PAYROLL_COMPANY_MAPPING: ${LEDGERBRIDGE_PAYROLL_COMPANY_MAPPING:?payroll company mapping is required}
      LEDGERBRIDGE_PAYROLL_BFF_USER_ASSERTION_KEY: ${LEDGERBRIDGE_PAYROLL_BFF_USER_ASSERTION_KEY:?payroll BFF assertion key is required}
      LEDGERBRIDGE_PAYROLL_BFF_USER_ASSERTION_ISSUER: ${LEDGERBRIDGE_PAYROLL_BFF_USER_ASSERTION_ISSUER:?payroll BFF issuer is required}
      LEDGERBRIDGE_PAYROLL_BFF_USER_ASSERTION_AUDIENCE: ${LEDGERBRIDGE_PAYROLL_BFF_USER_ASSERTION_AUDIENCE:?payroll BFF audience is required}
      LEDGERBRIDGE_PAYROLL_PROVIDER_WORKLOAD_ASSERTION_KEY: ${LEDGERBRIDGE_PAYROLL_PROVIDER_WORKLOAD_ASSERTION_KEY:?provider workload assertion key is required}
      LEDGERBRIDGE_PAYROLL_PROVIDER_USER_ASSERTION_KEY: ${LEDGERBRIDGE_PAYROLL_PROVIDER_USER_ASSERTION_KEY:?provider user assertion key is required}
      LEDGERBRIDGE_PAYROLL_PROVIDER_ASSERTION_ISSUER: LedgerBridge
      LEDGERBRIDGE_PAYROLL_PROVIDER_ASSERTION_AUDIENCE: PayrollVerification
      LEDGERBRIDGE_PAYROLL_PROVIDER_SERVICE_SUBJECT: ${LEDGERBRIDGE_PAYROLL_PROVIDER_SERVICE_SUBJECT:?provider service subject is required}
      LEDGERBRIDGE_ENABLE_PAYROLL_COMMANDS: ${LEDGERBRIDGE_ENABLE_PAYROLL_COMMANDS:-false}
      LEDGERBRIDGE_ENABLE_PAYROLL_TEST_WORKSPACES: ${LEDGERBRIDGE_ENABLE_PAYROLL_TEST_WORKSPACES:-false}
      LEDGERBRIDGE_PAYROLL_PROVIDER_TRUSTED_COMMAND_CONTRACT: ${LEDGERBRIDGE_PAYROLL_PROVIDER_TRUSTED_COMMAND_CONTRACT:-disabled}
      LEDGERBRIDGE_PAYROLL_COMMAND_ALLOWLIST: ${LEDGERBRIDGE_PAYROLL_COMMAND_ALLOWLIST:-[]}
      LEDGERBRIDGE_PAYROLL_ROLE_BINDINGS: ${LEDGERBRIDGE_PAYROLL_ROLE_BINDINGS:-{}}
    depends_on:
      postgres:
        condition: service_healthy
      internal-socket-init:
        condition: service_completed_successfully
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 384m
    networks:
      - backend
    volumes:
      - artifacts:/var/lib/ledgerbridge/artifacts:ro
      - internal-read-socket:/run/ledgerbridge-internal
      - evidence-unlock-socket:/run/ledgerbridge-unlocker:ro
      - ${LEDGERBRIDGE_INTERNAL_READ_POLICY_HOST_FILE:?policy host file is required}:/run/ledgerbridge-policy/policy.json:ro
      - ${LEDGERBRIDGE_EVIDENCE_KEY_HOST_FILE:?evidence key host file is required}:/run/ledgerbridge-key/evidence-key.json:ro
      - ${LEDGERBRIDGE_ORIGINAL_RECONCILIATION_LAYOUT_HOST_FILE:?reviewed original-reconciliation layout host file is required}:/run/ledgerbridge-private/original-reconciliation-layout.json:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(socket.AF_UNIX); s.settimeout(2); s.connect('/run/ledgerbridge-internal/core.sock'); e=bytes((13,10)); s.sendall(b'GET /health/ready HTTP/1.0'+e+b'Host: localhost'+e+e); data=s.recv(128); s.close(); raise SystemExit(0 if b' 200 ' in data else 1)"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 15s

  evidence-unlocker:
    profiles: ["evidence-unlock"]
    image: ledgerbridge-app:${LEDGERBRIDGE_REVISION:?review image revision is required}
    command: ["python", "-m", "ledgerbridge.evidence_unlocker_server"]
    user: "10001:10001"
    environment:
      LEDGERBRIDGE_ENV: production
      LEDGERBRIDGE_ARTIFACT_ROOT: /var/lib/ledgerbridge/artifacts
      LEDGERBRIDGE_ARTIFACT_MAX_BYTES: ${LEDGERBRIDGE_ARTIFACT_MAX_BYTES:-52428800}
      LEDGERBRIDGE_ARTIFACT_TOTAL_MAX_BYTES: ${LEDGERBRIDGE_ARTIFACT_TOTAL_MAX_BYTES:-10737418240}
      LEDGERBRIDGE_ARTIFACT_STAGING_MAX_BYTES: ${LEDGERBRIDGE_ARTIFACT_STAGING_MAX_BYTES:-536870912}
      LEDGERBRIDGE_ARTIFACT_STAGING_TTL_SECONDS: ${LEDGERBRIDGE_ARTIFACT_STAGING_TTL_SECONDS:-3600}
      LEDGERBRIDGE_INTERNAL_READ_EVIDENCE_KEY_FILE: /run/ledgerbridge-key/evidence-key.json
      LEDGERBRIDGE_INTERNAL_EVIDENCE_UNLOCK_SOCKET_PATH: /run/ledgerbridge-unlocker/evidence-unlocker.sock
      LEDGERBRIDGE_INTERNAL_EVIDENCE_UNLOCK_TIMEOUT_SECONDS: ${LEDGERBRIDGE_INTERNAL_EVIDENCE_UNLOCK_TIMEOUT_SECONDS:-30}
      LEDGERBRIDGE_INTERNAL_EVIDENCE_UNLOCK_CONCURRENCY: ${LEDGERBRIDGE_INTERNAL_EVIDENCE_UNLOCK_CONCURRENCY:-2}
      LEDGERBRIDGE_INTERNAL_EVIDENCE_UNLOCK_MAX_OUTPUT_BYTES: ${LEDGERBRIDGE_INTERNAL_EVIDENCE_UNLOCK_MAX_OUTPUT_BYTES:-52428800}
      LEDGERBRIDGE_INTERNAL_EVIDENCE_UNLOCK_MAX_MEMBERS: ${LEDGERBRIDGE_INTERNAL_EVIDENCE_UNLOCK_MAX_MEMBERS:-64}
    depends_on:
      internal-socket-init:
        condition: service_completed_successfully
    restart: unless-stopped
    read_only: true
    network_mode: none
    tmpfs:
      - /tmp:size=64m,mode=0700,uid=10001,gid=10001
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64
    mem_limit: 384m
    volumes:
      - artifacts:/var/lib/ledgerbridge/artifacts
      - evidence-unlock-socket:/run/ledgerbridge-unlocker
      - ${LEDGERBRIDGE_EVIDENCE_KEY_HOST_FILE:?evidence key host file is required}:/run/ledgerbridge-key/evidence-key.json:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import os,stat; p='/run/ledgerbridge-unlocker/evidence-unlocker.sock'; s=os.stat(p); raise SystemExit(0 if stat.S_ISSOCK(s.st_mode) and stat.S_IMODE(s.st_mode)==0o600 else 1)"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 15s

  internal-ingress:
    image: nginx@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    command:
      - /bin/sh
      - -ec
      - mkdir -p /tmp/client-body /tmp/proxy /tmp/fastcgi /tmp/uwsgi /tmp/scgi; exec nginx -c /etc/nginx/nginx.conf -g 'daemon off;'
    user: "10001:10001"
    depends_on:
      internal-reader:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=0700,uid=10001,gid=10001
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64
    mem_limit: 64m
    networks:
      - review-link
    volumes:
      - internal-read-socket:/run/ledgerbridge-internal:ro
      - ./docker/internal-ingress.nginx.conf:/etc/nginx/nginx.conf:ro
      - ${LEDGERBRIDGE_INTERNAL_TLS_CA_HOST_FILE:?TLS CA host file is required}:/run/ledgerbridge-tls/ca.crt:ro
      - ${LEDGERBRIDGE_INTERNAL_TLS_SERVER_CERT_HOST_FILE:?TLS server certificate host file is required}:/run/ledgerbridge-tls/server.crt:ro
      - ${LEDGERBRIDGE_INTERNAL_TLS_SERVER_KEY_HOST_FILE:?TLS server key host file is required}:/run/ledgerbridge-tls/server.key:ro

networks:
  review-link:
    external: true
    name: ledgerbridge_core_review

volumes:
  internal-read-socket:
  evidence-unlock-socket:

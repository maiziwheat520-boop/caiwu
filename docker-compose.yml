name: ledgerbridge

x-runtime-environment: &runtime-environment
  LEDGERBRIDGE_ENV: ${LEDGERBRIDGE_ENV:-production}
  LEDGERBRIDGE_LOG_LEVEL: ${LEDGERBRIDGE_LOG_LEVEL:-INFO}
  LEDGERBRIDGE_ENABLE_INTERNAL_UPLOAD: ${LEDGERBRIDGE_ENABLE_INTERNAL_UPLOAD:-false}
  LEDGERBRIDGE_ARTIFACT_ROOT: ${LEDGERBRIDGE_ARTIFACT_ROOT:-/var/lib/ledgerbridge/artifacts}
  LEDGERBRIDGE_ARTIFACT_MAX_BYTES: ${LEDGERBRIDGE_ARTIFACT_MAX_BYTES:-52428800}
  LEDGERBRIDGE_ARTIFACT_TOTAL_MAX_BYTES: ${LEDGERBRIDGE_ARTIFACT_TOTAL_MAX_BYTES:-10737418240}
  LEDGERBRIDGE_ARTIFACT_STAGING_MAX_BYTES: ${LEDGERBRIDGE_ARTIFACT_STAGING_MAX_BYTES:-536870912}
  LEDGERBRIDGE_ARTIFACT_STAGING_TTL_SECONDS: ${LEDGERBRIDGE_ARTIFACT_STAGING_TTL_SECONDS:-3600}
  LEDGERBRIDGE_UPLOAD_READ_TIMEOUT_SECONDS: ${LEDGERBRIDGE_UPLOAD_READ_TIMEOUT_SECONDS:-120}
  LEDGERBRIDGE_UPLOAD_CONCURRENCY: ${LEDGERBRIDGE_UPLOAD_CONCURRENCY:-2}

x-app: &app
  image: ledgerbridge-app:${LEDGERBRIDGE_REVISION:-dev}
  build:
    context: .
    dockerfile: docker/app.Dockerfile
    args:
      LEDGERBRIDGE_REVISION: ${DEPLOYED_REVISION:-dev}
  environment:
    <<: *runtime-environment
  depends_on:
    postgres:
      condition: service_healthy
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  pids_limit: 128
  mem_limit: 256m
  networks:
    - backend

services:
  api:
    <<: *app
    command: ["uvicorn", "ledgerbridge.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      <<: *runtime-environment
      LEDGERBRIDGE_RUNTIME_ROLE: api
      LEDGERBRIDGE_API_DATABASE_URL: ${LEDGERBRIDGE_API_DATABASE_URL:?api database URL is required}
    networks:
      - backend
      - ingress
    ports:
      - "127.0.0.1:8650:8000"
    volumes:
      - artifacts:/var/lib/ledgerbridge/artifacts:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    <<: *app
    command: ["python", "-m", "ledgerbridge.worker"]
    environment:
      <<: *runtime-environment
      LEDGERBRIDGE_RUNTIME_ROLE: worker
      LEDGERBRIDGE_WORKER_DATABASE_URL: ${LEDGERBRIDGE_WORKER_DATABASE_URL:?worker database URL is required}
    volumes:
      - artifacts:/var/lib/ledgerbridge/artifacts
      - connector-socket:/run/ledgerbridge-connector
    healthcheck:
      test: ["CMD", "python", "-c", "from ledgerbridge.worker import heartbeat_is_fresh; raise SystemExit(0 if heartbeat_is_fresh() else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  migrate:
    <<: *app
    profiles: ["tools"]
    command: ["alembic", "upgrade", "head"]
    environment:
      # The migration container is an owner-only tool, not an API/worker runtime.
      LEDGERBRIDGE_RUNTIME_ROLE: migrate
      # A missing environment must stop the owner-only migration rather than
      # silently taking the non-production compatibility path.
      LEDGERBRIDGE_ENV: ${LEDGERBRIDGE_ENV:?LEDGERBRIDGE_ENV is required}
      LEDGERBRIDGE_LOG_LEVEL: ${LEDGERBRIDGE_LOG_LEVEL:-INFO}
      LEDGERBRIDGE_DATABASE_URL: ${LEDGERBRIDGE_MIGRATION_DATABASE_URL:?migration database URL is required}
      LEDGERBRIDGE_ARTIFACT_ROOT: ${LEDGERBRIDGE_ARTIFACT_ROOT:-/var/lib/ledgerbridge/artifacts}
      LEDGERBRIDGE_ARTIFACT_MAX_BYTES: ${LEDGERBRIDGE_ARTIFACT_MAX_BYTES:-52428800}
      LEDGERBRIDGE_ARTIFACT_TOTAL_MAX_BYTES: ${LEDGERBRIDGE_ARTIFACT_TOTAL_MAX_BYTES:-10737418240}
      LEDGERBRIDGE_ARTIFACT_STAGING_MAX_BYTES: ${LEDGERBRIDGE_ARTIFACT_STAGING_MAX_BYTES:-536870912}
      LEDGERBRIDGE_ARTIFACT_STAGING_TTL_SECONDS: ${LEDGERBRIDGE_ARTIFACT_STAGING_TTL_SECONDS:-3600}
    restart: "no"

  mail-collector:
    <<: *app
    profiles: ["phase3"]
    command: ["python", "-m", "ledgerbridge.mail_collector"]
    restart: "no"
    volumes:
      - artifacts:/var/lib/ledgerbridge/artifacts
    networks:
      - backend
      - egress

  connector-runner:
    image: ledgerbridge-connector-runner:${LEDGERBRIDGE_REVISION:-dev}
    build:
      context: .
      dockerfile: docker/connector-runner.Dockerfile
      args:
        LEDGERBRIDGE_REVISION: ${DEPLOYED_REVISION:-dev}
    profiles: ["connector-runner"]
    command: ["python", "-m", "ledgerbridge.connector_runner", "--socket", "/run/ledgerbridge-connector/runner.sock"]
    network_mode: none
    volumes:
      - connector-socket:/run/ledgerbridge-connector
    read_only: true
    tmpfs:
      - /tmp:size=96m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64
    mem_limit: 128m
    cpus: "0.50"
    user: "10001:10001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "from ledgerbridge.runner_client import ConnectorRunnerClient; raise SystemExit(0 if ConnectorRunnerClient('/run/ledgerbridge-connector/runner.sock').health_check() else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  postgres:
    image: postgres:15-alpine@sha256:fe0737ba566a2c5b2a28f34433c0a423261900ec17b9bf7ad115e1aae7e57f1b
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: --data-checksums
      LEDGERBRIDGE_APP_DB_PASSWORD: ${LEDGERBRIDGE_APP_DB_PASSWORD:?runtime database password is required}
      LEDGERBRIDGE_API_DB_PASSWORD: ${LEDGERBRIDGE_API_DB_PASSWORD:?api runtime database password is required}
      LEDGERBRIDGE_WORKER_DB_PASSWORD: ${LEDGERBRIDGE_WORKER_DB_PASSWORD:?worker runtime database password is required}
    restart: unless-stopped
    mem_limit: 512m
    pids_limit: 128
    networks:
      - backend
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init-runtime-role.sh:/docker-entrypoint-initdb.d/10-ledgerbridge-runtime-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

networks:
  backend:
    internal: true
  ingress:
  egress:

volumes:
  artifacts:
  postgres-data:
  connector-socket:

worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 128;
}

http {
    access_log off;
    client_body_temp_path /tmp/client-body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 64k;

    map $server_port $ledgerbridge_client_san {
        default "";
        8443 spiffe://ledgerbridge.local/web-review;
        8444 spiffe://ledgerbridge.local/web/company-reports;
    }

    server {
        listen 8443 ssl;
        listen 8444 ssl;
        server_name internal-ingress;

        ssl_certificate /run/ledgerbridge-tls/server.crt;
        ssl_certificate_key /run/ledgerbridge-tls/server.key;
        ssl_client_certificate /run/ledgerbridge-tls/ca.crt;
        ssl_verify_client on;
        ssl_verify_depth 1;
        ssl_protocols TLSv1.3;
        ssl_session_tickets off;

        location ^~ /internal/v1/ {
            proxy_pass http://unix:/run/ledgerbridge-internal/core.sock;
            proxy_http_version 1.1;
            proxy_set_header Host ledgerbridge-core.local;
            proxy_set_header Connection "";
            proxy_set_header X-LedgerBridge-mTLS-Verified SUCCESS;
            proxy_set_header X-LedgerBridge-Client-SAN $ledgerbridge_client_san;
            proxy_set_header X-LedgerBridge-Client-Serial $ssl_client_serial;
            proxy_set_header X-Forwarded-Client-Cert "";
            proxy_set_header X-Client-Cert "";
            proxy_set_header X-SSL-Client-Cert "";
            proxy_set_header X-Principal "";
        }

        location / {
            return 404;
        }
    }
}

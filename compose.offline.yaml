services:
  web:
    image: python:3.12-slim
    container_name: ledgerbridge-web-preview
    restart: unless-stopped
    user: "65534:65534"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      PORT: "8080"
      SITE_ROOT: /site
    command:
      - python
      - /app/server.py
    volumes:
      - ./dist:/site:ro
      - ./deploy/server.py:/app/server.py:ro
    tmpfs:
      - /tmp:size=16m,mode=1777
    ports:
      - "${LEDGERBRIDGE_WEB_PORT:-8780}:8080"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2).read()
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # immutable upstream SHA
        with:
          # Gitleaks must inspect the complete repository history.
          fetch-depth: 0
      - uses: actions/setup-python@751276eafca55f10f252026015f43c488f2322ba # immutable upstream SHA
        with:
          python-version: "3.12"
      - run: python scripts/check_sensitive_paths.py
      - uses: gitleaks/gitleaks-action@bcfb9cce635345aac9996cedc19b2de8e01b894f
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine@sha256:fe0737ba566a2c5b2a28f34433c0a423261900ec17b9bf7ad115e1aae7e57f1b
        env:
          POSTGRES_DB: ledgerbridge_test
          POSTGRES_USER: ledgerbridge_admin
          POSTGRES_PASSWORD: test-only-admin-password
          POSTGRES_INITDB_ARGS: --data-checksums
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ledgerbridge_admin -d ledgerbridge_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      LEDGERBRIDGE_ENV: test
      LEDGERBRIDGE_DATABASE_URL: postgresql+psycopg://ledgerbridge_app:test-only-runtime-password@localhost:5432/ledgerbridge_test
      LEDGERBRIDGE_MIGRATION_DATABASE_URL: postgresql+psycopg://ledgerbridge_owner:test-only-owner-password@localhost:5432/ledgerbridge_test
      LEDGERBRIDGE_TEST_ADMIN_DATABASE_URL: postgresql+psycopg://ledgerbridge_admin:test-only-admin-password@localhost:5432/postgres
      LEDGERBRIDGE_API_DATABASE_URL: postgresql+psycopg://ledgerbridge_api:test-only-api-password@localhost:5432/ledgerbridge_test
      LEDGERBRIDGE_WORKER_DATABASE_URL: postgresql+psycopg://ledgerbridge_worker:test-only-worker-password@localhost:5432/ledgerbridge_test
      LEDGERBRIDGE_ARTIFACT_ROOT: /tmp/ledgerbridge-artifacts
      PGPASSWORD: test-only-admin-password
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # immutable upstream SHA
      - uses: actions/setup-python@751276eafca55f10f252026015f43c488f2322ba # immutable upstream SHA
        with:
          python-version: "3.12"
      - run: 'python -m pip install --require-hashes --only-binary=:all: -r docker/uv-requirements.txt'
      - run: uv sync --frozen --extra dev
      - name: Bootstrap migration and least-privileged runtime roles
        run: >-
          psql -h localhost -U ledgerbridge_admin -d postgres
          -v ON_ERROR_STOP=1
          -c "CREATE ROLE ledgerbridge_owner LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS PASSWORD 'test-only-owner-password'; CREATE ROLE ledgerbridge_app LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS PASSWORD 'test-only-runtime-password'; CREATE ROLE ledgerbridge_api LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS PASSWORD 'test-only-api-password'; CREATE ROLE ledgerbridge_worker LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS PASSWORD 'test-only-worker-password'; CREATE ROLE ledgerbridge_reader LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS PASSWORD 'test-only-reader-password'"
      - run: >-
          psql -h localhost -U ledgerbridge_admin -d ledgerbridge_test
          -v ON_ERROR_STOP=1
          -c "GRANT USAGE, CREATE ON SCHEMA public TO ledgerbridge_owner; ALTER SCHEMA public OWNER TO ledgerbridge_owner"
      - run: >-
          psql -h localhost -U ledgerbridge_admin -d template1
          -v ON_ERROR_STOP=1
          -c "GRANT USAGE, CREATE ON SCHEMA public TO pg_database_owner; ALTER SCHEMA public OWNER TO pg_database_owner"
      - run: >-
          psql -h localhost -U ledgerbridge_admin -d postgres
          -v ON_ERROR_STOP=1
          -c "ALTER DATABASE ledgerbridge_test OWNER TO ledgerbridge_owner"
      - run: mkdir -p "$LEDGERBRIDGE_ARTIFACT_ROOT"
      - run: uv run --frozen --extra dev python scripts/check_sensitive_paths.py
      - run: uv run --frozen --extra dev ruff check .
      - run: uv run --frozen --extra dev ruff format --check .
      - run: uv run --frozen --extra dev mypy src alembic tests scripts
      # R1 is still a synthetic, deliberately unwired contract slice.  Keep a
      # meaningful floor while its database-backed implementation tests land;
      # production enablement remains separately rejected by configuration.
      - run: uv run --frozen --extra dev pytest --cov=ledgerbridge --cov=scripts.deployment_manifest --cov-report=term-missing --cov-fail-under=90
      - run: uv run --frozen --extra dev alembic upgrade head
        env:
          LEDGERBRIDGE_DATABASE_URL: ${{ env.LEDGERBRIDGE_MIGRATION_DATABASE_URL }}
      - run: uv run --frozen --extra dev alembic downgrade base
        env:
          LEDGERBRIDGE_DATABASE_URL: ${{ env.LEDGERBRIDGE_MIGRATION_DATABASE_URL }}
      - run: uv run --frozen --extra dev alembic upgrade head
        env:
          LEDGERBRIDGE_DATABASE_URL: ${{ env.LEDGERBRIDGE_MIGRATION_DATABASE_URL }}
      - run: uv run --frozen --extra dev bandit -c pyproject.toml -r src alembic scripts
      - run: uv export --quiet --frozen --extra dev --no-emit-project --format requirements.txt --output-file /tmp/ledgerbridge-audit-requirements.txt
      - run: uv run --frozen --extra dev pip-audit --strict --requirement /tmp/ledgerbridge-audit-requirements.txt

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # immutable upstream SHA
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker compose build api

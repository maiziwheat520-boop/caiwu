openapi: 3.1.0
info:
  title: LedgerBridge Web API
  version: 0.2.0-draft
  description: >-
    Hotel finance review and reconciliation contract. This draft intentionally
    has no endpoint that posts journal entries or enables real message ingestion.
servers:
  - url: /
security:
  - sessionCookie: []
paths:
  /api/v1/auth/status:
    get:
      operationId: getAuthStatus
      security: []
      responses:
        "200":
          description: Public authentication readiness without credential metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthStatus"
  /api/v1/auth/passkey/register/options:
    post:
      operationId: beginPasskeyRegistration
      security: []
      description: >-
        Begin a one-use WebAuthn registration ceremony on the configured exact HTTPS origin.
        Initial bootstrap requires the short-lived setup code. Recovery registration requires the
        restricted recovery-session cookie and its X-CSRF-Token; normal sessions cannot add a credential.
      parameters:
        - $ref: "#/components/parameters/OptionalCsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [setup_code]
              properties:
                setup_code:
                  type: string
                  maxLength: 200
      responses:
        "200":
          description: PublicKeyCredentialCreationOptions JSON and an HttpOnly ceremony cookie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebAuthnOptions"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/auth/passkey/register/verify:
    post:
      operationId: finishPasskeyRegistration
      security: []
      description: >-
        Finish the one-use ceremony. Bootstrap revalidates the setup code and expiry. Recovery
        revalidates the exact authorizing recovery session and X-CSRF-Token before atomically replacing
        old credentials, recovery codes, and sessions.
      parameters:
        - $ref: "#/components/parameters/OptionalCsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [setup_code, credential]
              properties:
                setup_code:
                  type: string
                  maxLength: 200
                credential:
                  $ref: "#/components/schemas/WebAuthnCredential"
      responses:
        "200":
          description: Authenticated session; recovery codes are returned only for initial registration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/auth/passkey/login/options:
    post:
      operationId: beginPasskeyLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        "200":
          description: PublicKeyCredentialRequestOptions JSON and an HttpOnly ceremony cookie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebAuthnOptions"
  /api/v1/auth/passkey/login/verify:
    post:
      operationId: finishPasskeyLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [credential]
              properties:
                credential:
                  $ref: "#/components/schemas/WebAuthnCredential"
      responses:
        "200":
          description: Authenticated single-user session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/auth/passkey/add/authorize/options:
    post:
      operationId: beginPasskeyAdditionAuthorization
      description: >-
        Begin a fresh user-verifying assertion with an already registered Passkey. This step-up
        ceremony is bound to the current full session, caller, authentication generation, and CSRF token.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        "200":
          description: PublicKeyCredentialRequestOptions JSON and an HttpOnly ceremony cookie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebAuthnOptions"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/auth/passkey/add/authorize/verify:
    post:
      operationId: finishPasskeyAdditionAuthorization
      description: >-
        Verify the fresh assertion and, without creating a new session, begin a registration
        ceremony that excludes every existing credential.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [credential]
              properties:
                credential:
                  $ref: "#/components/schemas/WebAuthnCredential"
      responses:
        "200":
          description: PublicKeyCredentialCreationOptions JSON and a replacement HttpOnly ceremony cookie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebAuthnOptions"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/auth/passkey/add/verify:
    post:
      operationId: finishPasskeyAddition
      description: >-
        Add one independent Passkey after revalidating the same live session and authentication
        generation. Existing Passkeys, recovery codes, and sessions are preserved.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [credential]
              properties:
                credential:
                  $ref: "#/components/schemas/WebAuthnCredential"
      responses:
        "200":
          description: The new Passkey was appended without revoking existing devices
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasskeyAdditionResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/auth/recovery:
    post:
      operationId: recoverSession
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [recovery_code]
              properties:
                recovery_code:
                  type: string
                  minLength: 32
                  maxLength: 64
      responses:
        "200":
          description: Restricted recovery session; it cannot access business APIs and can only replace the Passkey
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/auth/recovery/session:
    get:
      operationId: getRestrictedRecoverySession
      description: Rotate and return CSRF state for a live restricted recovery session after a page refresh.
      responses:
        "200":
          description: Restricted recovery session metadata; this does not authorize business APIs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/session:
    get:
      operationId: getSession
      responses:
        "200":
          description: Authenticated single-user session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/session/logout:
    post:
      operationId: logoutSession
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Session revoked and cookie expired
  /api/v1/candidates:
    get:
      operationId: listCandidates
      parameters:
        - $ref: "#/components/parameters/CandidateStatus"
        - $ref: "#/components/parameters/AccountingMonth"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Cursor-paginated candidate projection
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Candidate"
                  next_cursor:
                    type: [string, "null"]
                    maxLength: 512
  /api/v1/candidates/{candidate_id}:
    get:
      operationId: getCandidate
      parameters:
        - $ref: "#/components/parameters/CandidateId"
      responses:
        "200":
          description: Candidate with evidence and review history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CandidateDetail"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/candidates/{candidate_id}/decisions:
    post:
      operationId: appendCandidateDecision
      description: Append a review event and update the candidate projection atomically.
      parameters:
        - $ref: "#/components/parameters/CandidateId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CandidateDecisionRequest"
      responses:
        "200":
          description: Updated candidate projection and appended event
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [candidate, event]
                properties:
                  candidate:
                    $ref: "#/components/schemas/Candidate"
                  event:
                    $ref: "#/components/schemas/ReviewEvent"
        "409":
          description: Stale revision, unresolved conflict, or repeated idempotency key mismatch
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Required accounting fields are incomplete
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/review-events:
    get:
      operationId: listReviewEvents
      description: List append-only candidate review events in reverse chronological order.
      parameters:
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Cursor-paginated review history. The synthetic preview contains only synthetic events.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ReviewEvent"
                  next_cursor:
                    type: [string, "null"]
                    maxLength: 512
        "400":
          description: Cursor is malformed or exceeds the contract limit
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/evidence/{evidence_id}/content:
    get:
      operationId: downloadEvidence
      description: Download one authorized evidence object with a safe attachment filename.
      parameters:
        - name: evidence_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Immutable original evidence bytes
          headers:
            Content-Digest:
              schema:
                type: string
          content:
            text/plain:
              schema:
                type: string
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/evidence/{evidence_id}/preview:
    get:
      operationId: previewEvidence
      description: >-
        Return a bounded, inert preview of an authorized evidence object. The
        immutable original remains available only from the content endpoint.
      parameters:
        - name: evidence_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: reference
          in: query
          required: false
          schema:
            type: string
            pattern: "^[A-Za-z0-9._-]{1,64}$"
      responses:
        "200":
          description: Safe inline evidence preview
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidencePreview"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/evidence/unlocks:
    post:
      operationId: unlockEvidenceSource
      description: >-
        Forward one in-memory archive password to the configured Core adapter.
        The password is never persisted, logged, placed in a URL, or returned.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [source_ref, password]
              properties:
                source_ref:
                  type: string
                  format: uuid
                password:
                  type: string
                  minLength: 1
                  maxLength: 1024
                  writeOnly: true
      responses:
        "200":
          description: Core accepted the password and unlocked the evidence source.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [unlocked]
                properties:
                  unlocked:
                    type: boolean
                    const: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: The source reference or password was rejected without exposing Core response text.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: The fixed Core unlock endpoint is not configured or is unavailable.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/reconciliations/{accounting_month}:
    get:
      operationId: getReconciliation
      parameters:
        - $ref: "#/components/parameters/AccountingMonthPath"
      responses:
        "200":
          description: Read-only reconciliation projection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reconciliation"
  /api/v1/original-reconciliations/{accounting_month}:
    get:
      operationId: getOriginalReconciliation
      description: >-
        Read the fixed A-M, 40-row legacy-layout projection. The authenticated
        BFF fixes the Core scope; optional browser scope parameters may only
        repeat that authorized entity and business unit.
      parameters:
        - $ref: "#/components/parameters/AccountingMonthPath"
        - name: entity_ref
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: business_unit
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 100
      responses:
        "200":
          description: Read-only original-layout reconciliation projection
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OriginalReconciliation"
        "400":
          description: Invalid month or scope query
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The requested scope differs from the session-authorized scope
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: Core is unavailable or returned an invalid projection contract
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/reconciliations/{accounting_month}/drafts:
    post:
      operationId: createWorkbookDraft
      description: >-
        Create a workbook draft from a frozen input revision. The output remains
        a draft and never posts a journal entry.
      parameters:
        - $ref: "#/components/parameters/AccountingMonthPath"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_revision]
              properties:
                expected_revision:
                  type: integer
                  minimum: 1
      responses:
        "202":
          description: Draft generation accepted
          headers:
            Location:
              required: true
              description: Same-origin status URL for the accepted draft job.
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkbookDraft"
        "409":
          description: Reconciliation has blockers or the revision is stale
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/workbook-drafts/{draft_id}:
    get:
      operationId: getWorkbookDraft
      description: Poll one authorized draft until it reaches a terminal state.
      parameters:
        - name: draft_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Current draft generation and verification state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkbookDraft"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/connections:
    get:
      operationId: listConnections
      responses:
        "200":
          description: Redacted connection health without secrets or tokens
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ConnectionStatus"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-ledgerbridge_session
  parameters:
    CandidateId:
      name: candidate_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CandidateStatus:
      name: status
      in: query
      schema:
        $ref: "#/components/schemas/CandidateStatus"
    AccountingMonth:
      name: accounting_month
      in: query
      schema:
        type: string
        pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$"
    AccountingMonthPath:
      name: accounting_month
      in: path
      required: true
      schema:
        type: string
        pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$"
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
        pattern: "^[0-9]+$"
        maxLength: 512
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 32
        maxLength: 256
    OptionalCsrfToken:
      name: X-CSRF-Token
      in: header
      required: false
      description: Required only when registration is authorized by a restricted recovery session.
      schema:
        type: string
        minLength: 32
        maxLength: 256
  responses:
    Unauthorized:
      description: Authentication required
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Resource not found or not visible to the principal
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: Authentication state changed, credential already exists, or the Passkey limit was reached
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    AuthStatus:
      type: object
      additionalProperties: false
      required: [authenticated, setup_required, passkey_registered, recovery_setup_required, recovery_pending]
      properties:
        authenticated:
          type: boolean
        setup_required:
          type: boolean
        passkey_registered:
          type: boolean
        recovery_setup_required:
          type: boolean
        recovery_pending:
          type: boolean
          description: Old Passkeys are frozen until recovery finishes with a replacement credential.
        principal:
          type: string
          maxLength: 200
    AuthResult:
      type: object
      additionalProperties: false
      required: [authenticated, setup_required, passkey_registered, recovery_setup_required, recovery_pending]
      properties:
        authenticated:
          type: boolean
        setup_required:
          type: boolean
        passkey_registered:
          type: boolean
        recovery_setup_required:
          type: boolean
        recovery_pending:
          type: boolean
        principal:
          type: string
          maxLength: 200
        recovery_codes:
          type: array
          maxItems: 10
          items:
            type: string
            minLength: 32
            maxLength: 64
        csrf_token:
          type: string
          description: Returned with newly issued normal or restricted sessions; never persisted by the browser.
        expires_at:
          type: string
          format: date-time
    PasskeyAdditionResult:
      type: object
      additionalProperties: false
      required: [added, passkey_count]
      properties:
        added:
          type: boolean
          const: true
        passkey_count:
          type: integer
          minimum: 2
          maximum: 10
    WebAuthnOptions:
      type: object
      description: Standards-shaped WebAuthn options; binary values use unpadded base64url.
      additionalProperties: true
      required: [challenge]
      properties:
        challenge:
          type: string
          minLength: 32
    WebAuthnCredential:
      type: object
      description: Browser PublicKeyCredential JSON; ArrayBuffer fields use unpadded base64url.
      additionalProperties: true
      required: [id, rawId, type, response, clientExtensionResults]
      properties:
        id:
          type: string
        rawId:
          type: string
        type:
          const: public-key
        response:
          type: object
          additionalProperties: true
        clientExtensionResults:
          type: object
          additionalProperties: true
    Session:
      type: object
      additionalProperties: false
      required: [principal, csrf_token, expires_at]
      properties:
        principal:
          type: string
          maxLength: 200
        csrf_token:
          type: string
        expires_at:
          type: string
          format: date-time
    CandidateStatus:
      type: string
      enum: [INCOMPLETE, PENDING, CONFLICTED, CONFIRMED, IGNORED, SUPERSEDED]
    Candidate:
      allOf:
        - $ref: "#/components/schemas/CandidateFields"
      unevaluatedProperties: false
    CandidateFields:
      type: object
      required:
        - id
        - short_id
        - revision
        - status
        - source_channel
        - source_message_id
        - received_at
        - business_unit
        - category
        - amount_minor
        - currency
        - accounting_month
        - summary
        - confidence_basis_points
        - evidence
        - blockers
      properties:
        id:
          type: string
          format: uuid
        short_id:
          type: string
          pattern: "^C-[A-Z0-9]{4,8}$"
        revision:
          type: integer
          minimum: 1
        status:
          $ref: "#/components/schemas/CandidateStatus"
        source_channel:
          type: string
          enum: [telegram, dingtalk, weixin]
        source_message_id:
          type: string
          minLength: 1
          maxLength: 500
        received_at:
          type: string
          format: date-time
        business_unit:
          type: string
          minLength: 1
          maxLength: 200
        category:
          type: string
          minLength: 1
          maxLength: 200
        amount_minor:
          type: integer
          format: int64
        currency:
          type: string
          const: CNY
        accounting_month:
          type: [string, "null"]
          pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$"
        summary:
          type: string
          maxLength: 1000
        confidence_basis_points:
          type: integer
          minimum: 0
          maximum: 10000
        evidence:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/EvidenceReference"
        blockers:
          type: array
          items:
            $ref: "#/components/schemas/Blocker"
    CandidateDetail:
      allOf:
        - $ref: "#/components/schemas/CandidateFields"
        - type: object
          required: [review_events]
          properties:
            review_events:
              type: array
              items:
                $ref: "#/components/schemas/ReviewEvent"
      unevaluatedProperties: false
    EvidenceReference:
      type: object
      additionalProperties: false
      required: [id, kind, media_type, sha256, original_filename]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [message, attachment]
        media_type:
          type: string
          maxLength: 200
        sha256:
          type: string
          pattern: "^[a-f0-9]{64}$"
        original_filename:
          type: [string, "null"]
          maxLength: 500
        unlock_status:
          type: string
          enum: [NOT_REQUIRED, PASSWORD_REQUIRED, UNLOCKED]
        source_ref:
          type: [string, "null"]
          format: uuid
          description: Opaque canonical reference; required when unlock_status is PASSWORD_REQUIRED.
    EvidencePreview:
      type: object
      description: >-
        Bounded inert preview. kind selects image, text, spreadsheet, or an
        unsupported fallback; active document content is never emitted inline.
      required: [kind, filename]
      properties:
        kind:
          type: string
          enum: [image, text, spreadsheet, unsupported]
        filename:
          type: string
          maxLength: 200
        media_type:
          type: string
          enum: [image/jpeg, image/png, image/gif, image/webp]
        data_url:
          type: string
          maxLength: 12000000
        text:
          type: string
          maxLength: 262144
        reference:
          type: [string, "null"]
          maxLength: 64
        matched:
          type: boolean
        records:
          type: array
          maxItems: 4
          items:
            type: object
            required: [sheet, row_number, header_row_number, fields]
            properties:
              sheet:
                type: string
                maxLength: 200
              row_number:
                type: integer
                minimum: 1
              header_row_number:
                type: [integer, "null"]
                minimum: 1
              fields:
                type: array
                maxItems: 30
                items:
                  type: object
                  required: [label, value]
                  properties:
                    label:
                      type: string
                      maxLength: 1000
                    value:
                      type: string
                      maxLength: 1000
        fallback:
          type: [object, "null"]
        reason:
          type: string
          maxLength: 500
    Blocker:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          enum: [MISSING_ACCOUNTING_MONTH, DUPLICATE_MESSAGE, DUPLICATE_ATTACHMENT, BUSINESS_KEY_CONFLICT]
        message:
          type: string
          maxLength: 500
    CandidateDecisionRequest:
      oneOf:
        - $ref: "#/components/schemas/ConfirmDecision"
        - $ref: "#/components/schemas/CorrectAndConfirmDecision"
        - $ref: "#/components/schemas/IgnoreDecision"
        - $ref: "#/components/schemas/ResolveConflictDecision"
      discriminator:
        propertyName: decision
    DecisionBase:
      type: object
      required: [decision, expected_revision, reason]
      properties:
        decision:
          type: string
        expected_revision:
          type: integer
          minimum: 1
        reason:
          type: string
          minLength: 1
          maxLength: 1000
    ConfirmDecision:
      allOf:
        - $ref: "#/components/schemas/DecisionBase"
        - type: object
          properties:
            decision:
              const: CONFIRM
      unevaluatedProperties: false
    IgnoreDecision:
      allOf:
        - $ref: "#/components/schemas/DecisionBase"
        - type: object
          properties:
            decision:
              const: IGNORE
      unevaluatedProperties: false
    CorrectAndConfirmDecision:
      allOf:
        - $ref: "#/components/schemas/DecisionBase"
        - type: object
          required: [corrections]
          properties:
            decision:
              const: CORRECT_AND_CONFIRM
            corrections:
              $ref: "#/components/schemas/CorrectionSet"
      unevaluatedProperties: false
    ResolveConflictDecision:
      allOf:
        - $ref: "#/components/schemas/DecisionBase"
        - type: object
          required: [conflict_resolution]
          properties:
            decision:
              const: RESOLVE_CONFLICT
            conflict_resolution:
              type: string
              minLength: 1
              maxLength: 1000
            corrections:
              $ref: "#/components/schemas/CorrectionSet"
      unevaluatedProperties: false
    CorrectionSet:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        business_unit:
          type: string
          minLength: 1
          maxLength: 200
        category:
          type: string
          minLength: 1
          maxLength: 200
        amount_minor:
          type: integer
          format: int64
        accounting_month:
          type: string
          pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$"
    ReviewEvent:
      type: object
      additionalProperties: false
      required:
        - id
        - candidate_id
        - sequence
        - from_revision
        - to_revision
        - decision
        - actor
        - reason
        - changes
        - conflict_resolution
        - created_at
      properties:
        id:
          type: string
          format: uuid
        candidate_id:
          type: string
          format: uuid
        sequence:
          type: integer
          minimum: 1
        from_revision:
          type: integer
          minimum: 1
        to_revision:
          type: integer
          minimum: 2
        decision:
          type: string
          enum: [CONFIRM, CORRECT_AND_CONFIRM, IGNORE, RESOLVE_CONFLICT]
        actor:
          type: string
          maxLength: 200
        reason:
          type: string
          maxLength: 1000
        changes:
          type: array
          items:
            $ref: "#/components/schemas/FieldChange"
        conflict_resolution:
          type: [string, "null"]
          maxLength: 1000
        created_at:
          type: string
          format: date-time
    FieldChange:
      type: object
      additionalProperties: false
      required: [field, previous_value, new_value]
      properties:
        field:
          type: string
          enum: [business_unit, category, amount_minor, accounting_month, status]
        previous_value:
          type: [string, integer, "null"]
        new_value:
          type: [string, integer, "null"]
    Reconciliation:
      type: object
      additionalProperties: false
      required: [accounting_month, revision, ready, blockers, business_units]
      properties:
        accounting_month:
          type: string
        revision:
          type: integer
          minimum: 1
        ready:
          type: boolean
        blockers:
          type: array
          items:
            $ref: "#/components/schemas/Blocker"
        business_units:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name, amounts_minor]
            properties:
              name:
                type: string
              amounts_minor:
                type: object
                additionalProperties:
                  type: integer
                  format: int64
    OriginalReconciliation:
      type: object
      additionalProperties: false
      required:
        - contract_version
        - taxonomy_version
        - layout_version
        - mapping_version
        - is_complete
        - posted_ledger_complete
        - projection_gaps
        - month
        - scope
        - columns
        - rows
        - totals
        - pending_review_count
        - confirmed_pending_posting_count
        - missing_material_count
        - unmapped_confirmed_count
        - sources
      properties:
        contract_version:
          type: string
          const: ledgerbridge.original-reconciliation.v1
        taxonomy_version:
          type: string
          const: ledgerbridge.financial-foundation-blocker-taxonomy.v1
        layout_version:
          type: string
          minLength: 1
          maxLength: 100
        mapping_version:
          type: string
          minLength: 1
          maxLength: 100
        is_complete:
          type: boolean
          description: False whenever any review, material, mapping, GAP, or balance input is missing.
        posted_ledger_complete:
          type: boolean
          description: False means all POSTED total fields are null and must not be presented as zero.
        projection_gaps:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [MISSING_TIME_GRANULARITY, MISSING_BUSINESS_UNIT_ATTRIBUTION]
          description: Layout-independent gaps; Web must not infer missing subperiod or historical unit attribution.
        month:
          type: string
          pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$"
        scope:
          type: object
          additionalProperties: false
          required: [entity_ref, business_unit_ref]
          properties:
            entity_ref:
              type: string
              format: uuid
            business_unit_ref:
              type: string
              minLength: 1
              maxLength: 100
        columns:
          type: array
          minItems: 13
          maxItems: 13
          items:
            $ref: "#/components/schemas/OriginalReconciliationColumn"
        rows:
          type: array
          minItems: 40
          maxItems: 40
          items:
            $ref: "#/components/schemas/OriginalReconciliationRow"
        totals:
          $ref: "#/components/schemas/OriginalReconciliationTotals"
        pending_review_count:
          type: integer
          minimum: 0
        confirmed_pending_posting_count:
          type: integer
          minimum: 0
          description: Confirmed facts awaiting posting; excluded from POSTED totals.
        missing_material_count:
          type: integer
          minimum: 0
        unmapped_confirmed_count:
          type: integer
          minimum: 0
        sources:
          type: array
          items:
            $ref: "#/components/schemas/OriginalReconciliationSource"
    OriginalReconciliationColumn:
      type: object
      additionalProperties: false
      required: [column, ordinal, role]
      properties:
        column:
          type: string
          enum: [A, B, C, D, E, F, G, H, I, J, K, L, M]
        ordinal:
          type: integer
          minimum: 1
          maximum: 13
        role:
          type: string
          enum: [MAIN, SPACER, DETAIL]
    OriginalReconciliationRow:
      type: object
      additionalProperties: false
      required: [row_number, cells]
      properties:
        row_number:
          type: integer
          minimum: 1
          maximum: 40
        cells:
          type: array
          minItems: 13
          maxItems: 13
          items:
            $ref: "#/components/schemas/OriginalReconciliationCell"
    OriginalReconciliationCell:
      type: object
      description: GAP cells use gap_code with label null; only LABEL cells carry label text.
      additionalProperties: false
      required: [coordinate, column, row_number, kind, label, amount_minor, currency, gap_code, source_fact_refs]
      properties:
        coordinate:
          type: string
          pattern: "^[A-M]([1-9]|[1-3][0-9]|40)$"
        column:
          type: string
          enum: [A, B, C, D, E, F, G, H, I, J, K, L, M]
        row_number:
          type: integer
          minimum: 1
          maximum: 40
        kind:
          type: string
          enum: [BLANK, LABEL, AMOUNT, GAP]
        label:
          type: [string, "null"]
          minLength: 1
          maxLength: 200
        amount_minor:
          type: [integer, "null"]
          format: int64
        currency:
          type: [string, "null"]
          enum: [CNY, null]
        gap_code:
          type: [string, "null"]
          enum: [MISSING_LEGACY_SLOT_MAPPING, MISSING_BALANCE_MAPPING, MISSING_ECONOMIC_EFFECT, POSTED_LEDGER_UNAVAILABLE, null]
        source_fact_refs:
          type: array
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 200
    OriginalReconciliationTotals:
      type: object
      additionalProperties: false
      required:
        - posted_income_minor
        - posted_expense_minor
        - posted_profit_minor
        - opening_balance_minor
        - closing_balance_minor
        - mapped_cell_count
        - confirmed_candidate_amount_minor
        - posted_amount_minor
        - currency
      properties:
        posted_income_minor:
          type: [integer, "null"]
          format: int64
        posted_expense_minor:
          type: [integer, "null"]
          format: int64
        posted_profit_minor:
          type: [integer, "null"]
          format: int64
          description: Core-validated posted_income_minor minus posted_expense_minor.
        opening_balance_minor:
          type: [integer, "null"]
          format: int64
        closing_balance_minor:
          type: [integer, "null"]
          format: int64
        mapped_cell_count:
          type: integer
          minimum: 0
          maximum: 520
        confirmed_candidate_amount_minor:
          type: integer
          format: int64
          description: Signed audit amount for confirmed facts; not a posted P&L total.
        posted_amount_minor:
          type: [integer, "null"]
          format: int64
          description: Signed audit amount for posted sources.
        currency:
          type: string
          const: CNY
    OriginalReconciliationSource:
      type: object
      additionalProperties: false
      required: [source_kind, source_system, source_label, fact_count, mapped_fact_count, amount_minor]
      properties:
        source_kind:
          type: string
          enum: [POSTED_LEDGER, CONFIRMED_CANDIDATE, ACCOUNT_STATEMENT]
        source_system:
          type: string
          minLength: 1
          maxLength: 100
        source_label:
          type: [string, "null"]
          minLength: 1
          maxLength: 200
        fact_count:
          type: integer
          minimum: 0
        mapped_fact_count:
          type: integer
          minimum: 0
        amount_minor:
          type: integer
          format: int64
    WorkbookDraft:
      type: object
      additionalProperties: false
      required: [id, accounting_month, input_revision, status, verification, monitor_url]
      properties:
        id:
          type: string
          format: uuid
        accounting_month:
          type: string
        input_revision:
          type: integer
        status:
          type: string
          enum: [QUEUED, BUILDING, NEEDS_REVIEW, VERIFIED, FAILED]
        verification:
          type: [string, "null"]
          enum: [LIBREOFFICE_VERIFIED, null]
        monitor_url:
          type: string
          format: uri-reference
        output_sha256:
          type: [string, "null"]
          pattern: "^[a-f0-9]{64}$"
        verification_detail:
          type: [string, "null"]
          maxLength: 2000
    ConnectionStatus:
      type: object
      additionalProperties: false
      required: [id, state, checked_at]
      properties:
        id:
          type: string
          enum: [hermes_ingress, ledgerbridge_core, onedrive_appfolder, libreoffice_worker]
        state:
          type: string
          enum: [CONNECTED, DISCONNECTED, DEGRADED, NOT_CONFIGURED]
        checked_at:
          type: string
          format: date-time
        detail:
          type: string
          maxLength: 500
    Problem:
      type: object
      additionalProperties: true
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        code:
          type: string
        detail:
          type: string

openapi: 3.1.0
info:
  title: LedgerBridge Web API
  version: 0.2.0-draft
  description: >-
    Hotel finance review and reconciliation contract. This draft intentionally
    has no endpoint that posts journal entries or enables real message ingestion.
servers:
  - url: /
security:
  - sessionCookie: []
paths:
  /api/v1/auth/status:
    get:
      operationId: getAuthStatus
      security: []
      responses:
        "200":
          description: Public authentication readiness without credential metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthStatus"
  /api/v1/auth/passkey/register/options:
    post:
      operationId: beginPasskeyRegistration
      security: []
      description: >-
        Begin a one-use WebAuthn registration ceremony on the configured exact HTTPS origin.
        Initial bootstrap requires the short-lived setup code. Recovery registration requires the
        restricted recovery-session cookie and its X-CSRF-Token; normal sessions cannot add a credential.
      parameters:
        - $ref: "#/components/parameters/OptionalCsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [setup_code]
              properties:
                setup_code:
                  type: string
                  maxLength: 200
      responses:
        "200":
          description: PublicKeyCredentialCreationOptions JSON and an HttpOnly ceremony cookie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebAuthnOptions"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/auth/passkey/register/verify:
    post:
      operationId: finishPasskeyRegistration
      security: []
      description: >-
        Finish the one-use ceremony. Bootstrap revalidates the setup code and expiry. Recovery
        revalidates the exact authorizing recovery session and X-CSRF-Token before atomically replacing
        old credentials, recovery codes, and sessions.
      parameters:
        - $ref: "#/components/parameters/OptionalCsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [setup_code, credential]
              properties:
                setup_code:
                  type: string
                  maxLength: 200
                credential:
                  $ref: "#/components/schemas/WebAuthnCredential"
      responses:
        "200":
          description: Authenticated session; recovery codes are returned only for initial registration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/auth/passkey/login/options:
    post:
      operationId: beginPasskeyLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        "200":
          description: PublicKeyCredentialRequestOptions JSON and an HttpOnly ceremony cookie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebAuthnOptions"
  /api/v1/auth/passkey/login/verify:
    post:
      operationId: finishPasskeyLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [credential]
              properties:
                credential:
                  $ref: "#/components/schemas/WebAuthnCredential"
      responses:
        "200":
          description: Authenticated single-user session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/auth/recovery:
    post:
      operationId: recoverSession
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [recovery_code]
              properties:
                recovery_code:
                  type: string
                  minLength: 32
                  maxLength: 64
      responses:
        "200":
          description: Restricted recovery session; it cannot access business APIs and can only replace the Passkey
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/auth/recovery/session:
    get:
      operationId: getRestrictedRecoverySession
      description: Rotate and return CSRF state for a live restricted recovery session after a page refresh.
      responses:
        "200":
          description: Restricted recovery session metadata; this does not authorize business APIs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/session:
    get:
      operationId: getSession
      responses:
        "200":
          description: Authenticated single-user session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/session/logout:
    post:
      operationId: logoutSession
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Session revoked and cookie expired
  /api/v1/candidates:
    get:
      operationId: listCandidates
      parameters:
        - $ref: "#/components/parameters/CandidateStatus"
        - $ref: "#/components/parameters/AccountingMonth"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Cursor-paginated candidate projection
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Candidate"
                  next_cursor:
                    type: [string, "null"]
                    maxLength: 512
  /api/v1/candidates/{candidate_id}:
    get:
      operationId: getCandidate
      parameters:
        - $ref: "#/components/parameters/CandidateId"
      responses:
        "200":
          description: Candidate with evidence and review history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CandidateDetail"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/candidates/{candidate_id}/decisions:
    post:
      operationId: appendCandidateDecision
      description: Append a review event and update the candidate projection atomically.
      parameters:
        - $ref: "#/components/parameters/CandidateId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CandidateDecisionRequest"
      responses:
        "200":
          description: Updated candidate projection and appended event
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [candidate, event]
                properties:
                  candidate:
                    $ref: "#/components/schemas/Candidate"
                  event:
                    $ref: "#/components/schemas/ReviewEvent"
        "409":
          description: Stale revision, unresolved conflict, or repeated idempotency key mismatch
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Required accounting fields are incomplete
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/evidence/{evidence_id}/content:
    get:
      operationId: downloadEvidence
      description: Download one authorized evidence object with a safe attachment filename.
      parameters:
        - name: evidence_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Immutable original evidence bytes
          headers:
            Content-Digest:
              schema:
                type: string
          content:
            text/plain:
              schema:
                type: string
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/reconciliations/{accounting_month}:
    get:
      operationId: getReconciliation
      parameters:
        - $ref: "#/components/parameters/AccountingMonthPath"
      responses:
        "200":
          description: Read-only reconciliation projection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reconciliation"
  /api/v1/reconciliations/{accounting_month}/drafts:
    post:
      operationId: createWorkbookDraft
      description: >-
        Create a workbook draft from a frozen input revision. The output remains
        a draft and never posts a journal entry.
      parameters:
        - $ref: "#/components/parameters/AccountingMonthPath"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_revision]
              properties:
                expected_revision:
                  type: integer
                  minimum: 1
      responses:
        "202":
          description: Draft generation accepted
          headers:
            Location:
              required: true
              description: Same-origin status URL for the accepted draft job.
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkbookDraft"
        "409":
          description: Reconciliation has blockers or the revision is stale
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/workbook-drafts/{draft_id}:
    get:
      operationId: getWorkbookDraft
      description: Poll one authorized draft until it reaches a terminal state.
      parameters:
        - name: draft_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Current draft generation and verification state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkbookDraft"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/connections:
    get:
      operationId: listConnections
      responses:
        "200":
          description: Redacted connection health without secrets or tokens
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ConnectionStatus"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-ledgerbridge_session
  parameters:
    CandidateId:
      name: candidate_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CandidateStatus:
      name: status
      in: query
      schema:
        $ref: "#/components/schemas/CandidateStatus"
    AccountingMonth:
      name: accounting_month
      in: query
      schema:
        type: string
        pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$"
    AccountingMonthPath:
      name: accounting_month
      in: path
      required: true
      schema:
        type: string
        pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$"
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
        maxLength: 512
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 32
        maxLength: 256
    OptionalCsrfToken:
      name: X-CSRF-Token
      in: header
      required: false
      description: Required only when registration is authorized by a restricted recovery session.
      schema:
        type: string
        minLength: 32
        maxLength: 256
  responses:
    Unauthorized:
      description: Authentication required
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Resource not found or not visible to the principal
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    AuthStatus:
      type: object
      additionalProperties: false
      required: [authenticated, setup_required, passkey_registered, recovery_setup_required, recovery_pending]
      properties:
        authenticated:
          type: boolean
        setup_required:
          type: boolean
        passkey_registered:
          type: boolean
        recovery_setup_required:
          type: boolean
        recovery_pending:
          type: boolean
          description: Old Passkeys are frozen until recovery finishes with a replacement credential.
        principal:
          type: string
          maxLength: 200
    AuthResult:
      type: object
      additionalProperties: false
      required: [authenticated, setup_required, passkey_registered, recovery_setup_required, recovery_pending]
      properties:
        authenticated:
          type: boolean
        setup_required:
          type: boolean
        passkey_registered:
          type: boolean
        recovery_setup_required:
          type: boolean
        recovery_pending:
          type: boolean
        principal:
          type: string
          maxLength: 200
        recovery_codes:
          type: array
          maxItems: 10
          items:
            type: string
            minLength: 32
            maxLength: 64
        csrf_token:
          type: string
          description: Returned with newly issued normal or restricted sessions; never persisted by the browser.
        expires_at:
          type: string
          format: date-time
    WebAuthnOptions:
      type: object
      description: Standards-shaped WebAuthn options; binary values use unpadded base64url.
      additionalProperties: true
      required: [challenge]
      properties:
        challenge:
          type: string
          minLength: 32
    WebAuthnCredential:
      type: object
      description: Browser PublicKeyCredential JSON; ArrayBuffer fields use unpadded base64url.
      additionalProperties: true
      required: [id, rawId, type, response, clientExtensionResults]
      properties:
        id:
          type: string
        rawId:
          type: string
        type:
          const: public-key
        response:
          type: object
          additionalProperties: true
        clientExtensionResults:
          type: object
          additionalProperties: true
    Session:
      type: object
      additionalProperties: false
      required: [principal, csrf_token, expires_at]
      properties:
        principal:
          type: string
          maxLength: 200
        csrf_token:
          type: string
        expires_at:
          type: string
          format: date-time
    CandidateStatus:
      type: string
      enum: [INCOMPLETE, PENDING, CONFLICTED, CONFIRMED, IGNORED, SUPERSEDED]
    Candidate:
      allOf:
        - $ref: "#/components/schemas/CandidateFields"
      unevaluatedProperties: false
    CandidateFields:
      type: object
      required:
        - id
        - short_id
        - revision
        - status
        - source_channel
        - source_message_id
        - received_at
        - business_unit
        - category
        - amount_minor
        - currency
        - accounting_month
        - summary
        - confidence_basis_points
        - evidence
        - blockers
      properties:
        id:
          type: string
          format: uuid
        short_id:
          type: string
          pattern: "^C-[A-Z0-9]{4,8}$"
        revision:
          type: integer
          minimum: 1
        status:
          $ref: "#/components/schemas/CandidateStatus"
        source_channel:
          type: string
          enum: [telegram, dingtalk, weixin]
        source_message_id:
          type: string
          minLength: 1
          maxLength: 500
        received_at:
          type: string
          format: date-time
        business_unit:
          type: string
          minLength: 1
          maxLength: 200
        category:
          type: string
          minLength: 1
          maxLength: 200
        amount_minor:
          type: integer
          format: int64
        currency:
          type: string
          const: CNY
        accounting_month:
          type: [string, "null"]
          pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$"
        summary:
          type: string
          maxLength: 1000
        confidence_basis_points:
          type: integer
          minimum: 0
          maximum: 10000
        evidence:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/EvidenceReference"
        blockers:
          type: array
          items:
            $ref: "#/components/schemas/Blocker"
    CandidateDetail:
      allOf:
        - $ref: "#/components/schemas/CandidateFields"
        - type: object
          required: [review_events]
          properties:
            review_events:
              type: array
              items:
                $ref: "#/components/schemas/ReviewEvent"
      unevaluatedProperties: false
    EvidenceReference:
      type: object
      additionalProperties: false
      required: [id, kind, media_type, sha256, original_filename]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [message, attachment]
        media_type:
          type: string
          maxLength: 200
        sha256:
          type: string
          pattern: "^[a-f0-9]{64}$"
        original_filename:
          type: [string, "null"]
          maxLength: 500
    Blocker:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          enum: [MISSING_ACCOUNTING_MONTH, DUPLICATE_MESSAGE, DUPLICATE_ATTACHMENT, BUSINESS_KEY_CONFLICT]
        message:
          type: string
          maxLength: 500
    CandidateDecisionRequest:
      oneOf:
        - $ref: "#/components/schemas/ConfirmDecision"
        - $ref: "#/components/schemas/CorrectAndConfirmDecision"
        - $ref: "#/components/schemas/IgnoreDecision"
        - $ref: "#/components/schemas/ResolveConflictDecision"
      discriminator:
        propertyName: decision
    DecisionBase:
      type: object
      required: [decision, expected_revision, reason]
      properties:
        decision:
          type: string
        expected_revision:
          type: integer
          minimum: 1
        reason:
          type: string
          minLength: 1
          maxLength: 1000
    ConfirmDecision:
      allOf:
        - $ref: "#/components/schemas/DecisionBase"
        - type: object
          properties:
            decision:
              const: CONFIRM
      unevaluatedProperties: false
    IgnoreDecision:
      allOf:
        - $ref: "#/components/schemas/DecisionBase"
        - type: object
          properties:
            decision:
              const: IGNORE
      unevaluatedProperties: false
    CorrectAndConfirmDecision:
      allOf:
        - $ref: "#/components/schemas/DecisionBase"
        - type: object
          required: [corrections]
          properties:
            decision:
              const: CORRECT_AND_CONFIRM
            corrections:
              $ref: "#/components/schemas/CorrectionSet"
      unevaluatedProperties: false
    ResolveConflictDecision:
      allOf:
        - $ref: "#/components/schemas/DecisionBase"
        - type: object
          required: [conflict_resolution]
          properties:
            decision:
              const: RESOLVE_CONFLICT
            conflict_resolution:
              type: string
              minLength: 1
              maxLength: 1000
            corrections:
              $ref: "#/components/schemas/CorrectionSet"
      unevaluatedProperties: false
    CorrectionSet:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        business_unit:
          type: string
          minLength: 1
          maxLength: 200
        category:
          type: string
          minLength: 1
          maxLength: 200
        amount_minor:
          type: integer
          format: int64
        accounting_month:
          type: string
          pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$"
    ReviewEvent:
      type: object
      additionalProperties: false
      required:
        - id
        - candidate_id
        - sequence
        - from_revision
        - to_revision
        - decision
        - actor
        - reason
        - changes
        - created_at
      properties:
        id:
          type: string
          format: uuid
        candidate_id:
          type: string
          format: uuid
        sequence:
          type: integer
          minimum: 1
        from_revision:
          type: integer
          minimum: 1
        to_revision:
          type: integer
          minimum: 2
        decision:
          type: string
          enum: [CONFIRM, CORRECT_AND_CONFIRM, IGNORE, RESOLVE_CONFLICT]
        actor:
          type: string
          maxLength: 200
        reason:
          type: string
          maxLength: 1000
        changes:
          type: array
          items:
            $ref: "#/components/schemas/FieldChange"
        conflict_resolution:
          type: [string, "null"]
          maxLength: 1000
        created_at:
          type: string
          format: date-time
    FieldChange:
      type: object
      additionalProperties: false
      required: [field, previous_value, new_value]
      properties:
        field:
          type: string
          enum: [business_unit, category, amount_minor, accounting_month, status]
        previous_value:
          type: [string, integer, "null"]
        new_value:
          type: [string, integer, "null"]
    Reconciliation:
      type: object
      additionalProperties: false
      required: [accounting_month, revision, ready, blockers, business_units]
      properties:
        accounting_month:
          type: string
        revision:
          type: integer
          minimum: 1
        ready:
          type: boolean
        blockers:
          type: array
          items:
            $ref: "#/components/schemas/Blocker"
        business_units:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name, amounts_minor]
            properties:
              name:
                type: string
              amounts_minor:
                type: object
                additionalProperties:
                  type: integer
                  format: int64
    WorkbookDraft:
      type: object
      additionalProperties: false
      required: [id, accounting_month, input_revision, status, verification, monitor_url]
      properties:
        id:
          type: string
          format: uuid
        accounting_month:
          type: string
        input_revision:
          type: integer
        status:
          type: string
          enum: [QUEUED, BUILDING, NEEDS_REVIEW, VERIFIED, FAILED]
        verification:
          type: [string, "null"]
          enum: [LIBREOFFICE_VERIFIED, null]
        monitor_url:
          type: string
          format: uri-reference
        output_sha256:
          type: [string, "null"]
          pattern: "^[a-f0-9]{64}$"
        verification_detail:
          type: [string, "null"]
          maxLength: 2000
    ConnectionStatus:
      type: object
      additionalProperties: false
      required: [id, state, checked_at]
      properties:
        id:
          type: string
          enum: [hermes_ingress, ledgerbridge_core, onedrive_appfolder, libreoffice_worker]
        state:
          type: string
          enum: [CONNECTED, DISCONNECTED, DEGRADED, NOT_CONFIGURED]
        checked_at:
          type: string
          format: date-time
        detail:
          type: string
          maxLength: 500
    Problem:
      type: object
      additionalProperties: true
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        code:
          type: string
        detail:
          type: string

openapi: 3.1.0
info:
  title: LedgerBridge Web API
  version: 0.3.0-draft
  description: >-
    Hotel finance review and reconciliation contract. This draft intentionally
    has no endpoint that posts journal entries or enables real message ingestion.
servers:
  - url: /
security:
  - sessionCookie: []
paths:
  /api/v1/auth/status:
    get:
      operationId: getAuthStatus
      security: []
      responses:
        "200":
          description: Public authentication readiness without credential metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthStatus"
  /api/v1/auth/passkey/register/options:
    post:
      operationId: beginPasskeyRegistration
      security: []
      description: >-
        Begin a one-use WebAuthn registration ceremony on the configured exact HTTPS origin.
        Initial bootstrap requires the short-lived setup code. Recovery registration requires the
        restricted recovery-session cookie and its X-CSRF-Token; normal sessions cannot add a credential.
      parameters:
        - $ref: "#/components/parameters/OptionalCsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [setup_code]
              properties:
                setup_code:
                  type: string
                  maxLength: 200
      responses:
        "200":
          description: PublicKeyCredentialCreationOptions JSON and an HttpOnly ceremony cookie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebAuthnOptions"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/auth/passkey/register/verify:
    post:
      operationId: finishPasskeyRegistration
      security: []
      description: >-
        Finish the one-use ceremony. Bootstrap revalidates the setup code and expiry. Recovery
        revalidates the exact authorizing recovery session and X-CSRF-Token before atomically replacing
        old credentials, recovery codes, and sessions.
      parameters:
        - $ref: "#/components/parameters/OptionalCsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [setup_code, credential]
              properties:
                setup_code:
                  type: string
                  maxLength: 200
                credential:
                  $ref: "#/components/schemas/WebAuthnCredential"
      responses:
        "200":
          description: Authenticated session; recovery codes are returned only for initial registration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/auth/passkey/login/options:
    post:
      operationId: beginPasskeyLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        "200":
          description: PublicKeyCredentialRequestOptions JSON and an HttpOnly ceremony cookie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebAuthnOptions"
  /api/v1/auth/passkey/login/verify:
    post:
      operationId: finishPasskeyLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [credential]
              properties:
                credential:
                  $ref: "#/components/schemas/WebAuthnCredential"
      responses:
        "200":
          description: Authenticated single-user session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/auth/passkey/add/authorize/options:
    post:
      operationId: beginPasskeyAdditionAuthorization
      description: >-
        Begin a fresh user-verifying assertion with an already registered Passkey. This step-up
        ceremony is bound to the current full session, caller, authentication generation, and CSRF token.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        "200":
          description: PublicKeyCredentialRequestOptions JSON and an HttpOnly ceremony cookie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebAuthnOptions"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/auth/passkey/add/authorize/verify:
    post:
      operationId: finishPasskeyAdditionAuthorization
      description: >-
        Verify the fresh assertion and, without creating a new session, begin a registration
        ceremony that excludes every existing credential.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [credential]
              properties:
                credential:
                  $ref: "#/components/schemas/WebAuthnCredential"
      responses:
        "200":
          description: PublicKeyCredentialCreationOptions JSON and a replacement HttpOnly ceremony cookie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebAuthnOptions"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/auth/passkey/add/verify:
    post:
      operationId: finishPasskeyAddition
      description: >-
        Add one independent Passkey after revalidating the same live session and authentication
        generation. Existing Passkeys, recovery codes, and sessions are preserved.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [credential]
              properties:
                credential:
                  $ref: "#/components/schemas/WebAuthnCredential"
      responses:
        "200":
          description: The new Passkey was appended without revoking existing devices
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasskeyAdditionResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/auth/recovery:
    post:
      operationId: recoverSession
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [recovery_code]
              properties:
                recovery_code:
                  type: string
                  minLength: 32
                  maxLength: 64
      responses:
        "200":
          description: Restricted recovery session; it cannot access business APIs and can only replace the Passkey
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/auth/recovery/session:
    get:
      operationId: getRestrictedRecoverySession
      description: Rotate and return CSRF state for a live restricted recovery session after a page refresh.
      responses:
        "200":
          description: Restricted recovery session metadata; this does not authorize business APIs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/session:
    get:
      operationId: getSession
      responses:
        "200":
          description: Authenticated single-user session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/session/logout:
    post:
      operationId: logoutSession
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Session revoked and cookie expired
  /api/v1/accounting-dimensions:
    get:
      operationId: getAccountingDimensions
      description: >-
        Return the business-unit references and category codes authorized for the
        server-configured entity. Browser-supplied entity parameters are rejected.
      responses:
        "200":
          description: Stable accounting identifiers paired with display labels
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountingDimensions"
        "400":
          description: Browser-supplied entity query parameters are rejected
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: Core accounting dimensions are unavailable or invalid
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/candidate-classification-groups:
    get:
      operationId: listCandidateClassificationGroups
      x-ledgerbridge-reject-unknown-query: true
      description: >-
        Return exact, authorization-scoped similar-transaction groups. The browser
        cannot widen entity or month scope. A group is a review aid, not an
        automatically learned classification rule.
      responses:
        "200":
          description: Deterministically ordered grouping and scope preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassificationGroupPage"
        "400":
          description: Browser attempted to supply grouping scope
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: Core grouping projection is unavailable or invalid
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/candidate-classification-groups/{group_ref}/decisions:
    post:
      operationId: applyCandidateClassificationBatch
      x-ledgerbridge-reject-unknown-query: true
      description: >-
        Apply one explicitly previewed classification to every listed member in a
        single all-or-nothing Core transaction. Every member carries an expected
        revision; any stale or changed member rejects the complete batch.
      parameters:
        - name: group_ref
          in: path
          required: true
          schema:
            type: string
            pattern: "^cg_[0-9a-f]{32}$"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClassificationBatchRequest"
      responses:
        "200":
          description: Self-contained atomic batch receipt or idempotent replay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassificationBatchReceipt"
        "400":
          description: Invalid query, CSRF, or idempotency request metadata
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Stale group/member revision or idempotency-key mismatch; no member is processed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Batch membership, target, or risk acknowledgement is invalid
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: Core batch command is unavailable or returned an invalid contract
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/company-reports:
    get:
      operationId: getCompanyReports
      description: >-
        Return three isolated, authorization-scoped reporting layers for the current
        calendar year. Browser-supplied company or date scope is rejected. Only the
        POSTED_LEDGER layer represents formal revenue, expense, and profit.
      responses:
        "200":
          description: Confirmed-source, account-statement, and posted-ledger layers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyReportsResponse"
        "400":
          description: Browser attempted to supply reporting scope
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/candidates:
    get:
      operationId: listCandidates
      parameters:
        - $ref: "#/components/parameters/CandidateStatus"
        - $ref: "#/components/parameters/AccountingMonth"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Cursor-paginated candidate projection
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Candidate"
                  next_cursor:
                    type: [string, "null"]
                    maxLength: 512
  /api/v1/candidates/{candidate_id}:
    get:
      operationId: getCandidate
      parameters:
        - $ref: "#/components/parameters/CandidateId"
      responses:
        "200":
          description: Candidate with evidence and review history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CandidateDetail"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/candidates/{candidate_id}/decisions:
    post:
      operationId: appendCandidateDecision
      description: Append a review event and update the candidate projection atomically.
      parameters:
        - $ref: "#/components/parameters/CandidateId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CandidateDecisionRequest"
      responses:
        "200":
          description: Updated candidate projection and appended event
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [candidate, event]
                properties:
                  candidate:
                    $ref: "#/components/schemas/Candidate"
                  event:
                    $ref: "#/components/schemas/ReviewEvent"
        "409":
          description: Stale revision, unresolved conflict, or repeated idempotency key mismatch
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Required accounting fields are incomplete
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/review-events:
    get:
      operationId: listReviewEvents
      description: List append-only candidate review events in reverse chronological order.
      parameters:
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Cursor-paginated review history. The synthetic preview contains only synthetic events.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ReviewEvent"
                  next_cursor:
                    type: [string, "null"]
                    maxLength: 512
        "400":
          description: Cursor is malformed or exceeds the contract limit
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/evidence/{evidence_id}/content:
    get:
      operationId: downloadEvidence
      description: Download one authorized evidence object with a safe attachment filename.
      parameters:
        - name: evidence_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Immutable original evidence bytes
          headers:
            Content-Digest:
              schema:
                type: string
          content:
            text/plain:
              schema:
                type: string
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/evidence/{evidence_id}/preview:
    get:
      operationId: previewEvidence
      description: >-
        Return a bounded, inert preview of an authorized evidence object. The
        immutable original remains available only from the content endpoint.
      parameters:
        - name: evidence_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: reference
          in: query
          required: false
          schema:
            type: string
            pattern: "^[A-Za-z0-9._-]{1,64}$"
      responses:
        "200":
          description: Safe inline evidence preview
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidencePreview"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/evidence/unlocks:
    post:
      operationId: unlockEvidenceSource
      x-ledgerbridge-reject-unknown-query: true
      description: >-
        Forward one in-memory archive password to the configured Core adapter.
        The password is never persisted, logged, placed in a URL, or returned.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [source_ref, password]
              properties:
                source_ref:
                  type: string
                  format: uuid
                password:
                  type: string
                  minLength: 1
                  maxLength: 1024
                  writeOnly: true
      responses:
        "200":
          description: Core accepted the password and unlocked the evidence source.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [unlocked]
                properties:
                  unlocked:
                    type: boolean
                    const: true
        "400":
          description: Query parameters are rejected before the request is processed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: The source reference or password was rejected without exposing Core response text.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: The fixed Core unlock endpoint is not configured or is unavailable.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/reconciliations/{accounting_month}:
    get:
      operationId: getReconciliation
      parameters:
        - $ref: "#/components/parameters/AccountingMonthPath"
      responses:
        "200":
          description: Read-only reconciliation projection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reconciliation"
  /api/v1/original-reconciliations/{accounting_month}:
    get:
      operationId: getOriginalReconciliation
      description: >-
        Read the fixed A-M, 40-row legacy-layout projection. The authenticated
        BFF fixes the Core scope; optional browser scope parameters may only
        repeat that authorized entity and business unit.
      parameters:
        - $ref: "#/components/parameters/AccountingMonthPath"
        - name: entity_ref
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: business_unit
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 100
      responses:
        "200":
          description: Read-only original-layout reconciliation projection
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OriginalReconciliation"
        "400":
          description: Invalid month or scope query
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The requested scope differs from the session-authorized scope
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: Core is unavailable or returned an invalid projection contract
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/reconciliations/{accounting_month}/drafts:
    post:
      operationId: createWorkbookDraft
      description: >-
        Create a workbook draft from a frozen input revision. The output remains
        a draft and never posts a journal entry.
      parameters:
        - $ref: "#/components/parameters/AccountingMonthPath"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_revision]
              properties:
                expected_revision:
                  type: integer
                  minimum: 1
      responses:
        "202":
          description: Draft generation accepted
          headers:
            Location:
              required: true
              description: Same-origin status URL for the accepted draft job.
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkbookDraft"
        "409":
          description: Reconciliation has blockers or the revision is stale
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/workbook-drafts/{draft_id}:
    get:
      operationId: getWorkbookDraft
      description: Poll one authorized draft until it reaches a terminal state.
      parameters:
        - name: draft_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Current draft generation and verification state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkbookDraft"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/connections:
    get:
      operationId: listConnections
      responses:
        "200":
          description: Redacted connection health without secrets or tokens
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ConnectionStatus"
  /api/v1/payroll/status:
    get:
      operationId: getPayrollStatus
      description: Read Core's truthful provider readiness and live-projection availability.
      responses:
        "200":
          description: Session- and entity-scoped payroll status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayrollStatusEnvelope"
        "409":
          $ref: "#/components/responses/PayrollEntitySelectionRequired"
        "503":
          $ref: "#/components/responses/PayrollUnavailable"
  /api/v1/payroll/test-workspace:
    get:
      operationId: getPayrollTestWorkspace
      description: Read the configured company's removable TEST_ONLY payroll workspace. Historical materials through 2026-08 are routed automatically; 2026-09 onward requires review.
      responses:
        "200":
          description: Session- and entity-scoped payroll test workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayrollTestWorkspaceEnvelope"
        "404":
          $ref: "#/components/responses/PayrollUnavailable"
        "409":
          $ref: "#/components/responses/PayrollEntitySelectionRequired"
        "503":
          $ref: "#/components/responses/PayrollUnavailable"
  /api/v1/payroll/dashboard:
    get:
      operationId: getPayrollDashboard
      responses:
        "200":
          description: Core-validated live payroll dashboard projection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayrollDashboardEnvelope"
        "409":
          $ref: "#/components/responses/PayrollEntitySelectionRequired"
        "503":
          $ref: "#/components/responses/PayrollUnavailable"
  /api/v1/payroll/materials:
    get:
      operationId: listPayrollMaterials
      description: Material list and safe detail fields from Core's integration projection.
      responses:
        "200":
          description: Core-validated payroll materials view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayrollMaterialsEnvelope"
        "409":
          $ref: "#/components/responses/PayrollEntitySelectionRequired"
        "503":
          $ref: "#/components/responses/PayrollUnavailable"
  /api/v1/payroll/batches:
    get:
      operationId: listPayrollBatches
      responses:
        "200":
          description: Core-validated payroll batches view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayrollBatchesEnvelope"
        "409":
          $ref: "#/components/responses/PayrollEntitySelectionRequired"
        "503":
          $ref: "#/components/responses/PayrollUnavailable"
  /api/v1/payroll/verification:
    get:
      operationId: getPayrollVerification
      responses:
        "200":
          description: Verification results and currently eligible evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayrollVerificationEnvelope"
        "409":
          $ref: "#/components/responses/PayrollEntitySelectionRequired"
        "503":
          $ref: "#/components/responses/PayrollUnavailable"
  /api/v1/payroll/batches/{batch_ref}/verify-receipts:
    post:
      operationId: verifyPayrollReceipts
      parameters:
        - $ref: "#/components/parameters/PayrollBatchRef"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayrollVerificationRequest"
      responses:
        "200":
          $ref: "#/components/responses/PayrollCommandSucceeded"
        "409":
          $ref: "#/components/responses/PayrollCommandConflict"
        "422":
          $ref: "#/components/responses/PayrollCommandRejected"
        "503":
          $ref: "#/components/responses/PayrollUnavailable"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-ledgerbridge_session
  parameters:
    CandidateId:
      name: candidate_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CandidateStatus:
      name: status
      in: query
      schema:
        $ref: "#/components/schemas/CandidateStatus"
    AccountingMonth:
      name: accounting_month
      in: query
      schema:
        type: string
        pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$"
    AccountingMonthPath:
      name: accounting_month
      in: path
      required: true
      schema:
        type: string
        pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$"
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
        pattern: "^[0-9]+$"
        maxLength: 512
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 32
        maxLength: 256
    OptionalCsrfToken:
      name: X-CSRF-Token
      in: header
      required: false
      description: Required only when registration is authorized by a restricted recovery session.
      schema:
        type: string
        minLength: 32
        maxLength: 256
    PayrollBatchRef:
      name: batch_ref
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/PayrollResourceRef"
  responses:
    Unauthorized:
      description: Authentication required
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: Authenticated principal is not authorized for the resource
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Resource not found or not visible to the principal
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: Authentication state changed, credential already exists, or the Passkey limit was reached
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PayrollEntitySelectionRequired:
      description: The authenticated session has no unique server-controlled entity selection.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PayrollUnavailable:
      description: Payroll integration or its trusted command boundary is unavailable.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PayrollCommandConflict:
      description: Version, idempotency, or concurrent workflow conflict.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PayrollCommandRejected:
      description: Confirmation, role, metadata, or verification evidence was rejected.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PayrollCommandSucceeded:
      description: Core committed the command or returned its original idempotent result.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PayrollCommandResult"
  schemas:
    PayrollResourceRef:
      type: string
      pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$"
    PayrollStableIdentifier:
      type: string
      pattern: "^[A-Za-z][A-Za-z0-9._:-]{2,127}$"
    PayrollStatusEnvelope:
      type: object
      additionalProperties: false
      required: [contract_version, entity_ref, company_id, data]
      properties:
        contract_version:
          const: ledgerbridge.payroll-read.v1
        entity_ref:
          type: string
          format: uuid
        company_id:
          $ref: "#/components/schemas/PayrollResourceRef"
        data:
          $ref: "#/components/schemas/PayrollStatusData"
    PayrollTestWorkspaceEnvelope:
      type: object
      additionalProperties: false
      required: [contract_version, entity_ref, company_id, data]
      properties:
        contract_version:
          const: ledgerbridge.payroll-test-workspace-read.v1
        entity_ref:
          type: string
          format: uuid
        company_id:
          $ref: "#/components/schemas/PayrollResourceRef"
        data:
          $ref: "#/components/schemas/PayrollTestWorkspaceData"
    PayrollTestWorkspaceData:
      type: object
      additionalProperties: false
      required: [schema_version, contract_version, data_scope, test_batch_id, company_id, cutoff_date, workspace_revision, projection_revision, etag, generated_at, auto_test_ready, payment_submission_supported, payable, submission_supported, routing_counts, materials]
      properties:
        schema_version:
          const: payroll-ledgerbridge-test-projection/v1
        contract_version:
          const: "1.0.0"
        data_scope:
          const: TEST_ONLY
        test_batch_id:
          $ref: "#/components/schemas/PayrollResourceRef"
        company_id:
          $ref: "#/components/schemas/PayrollResourceRef"
        cutoff_date:
          const: "2026-08-31"
        workspace_revision:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        projection_revision:
          $ref: "#/components/schemas/PayrollProjectionRevision"
        etag:
          $ref: "#/components/schemas/PayrollProjectionEtag"
        generated_at:
          $ref: "#/components/schemas/PayrollGeneratedAt"
        auto_test_ready:
          type: boolean
        payment_submission_supported:
          const: false
        payable:
          const: false
        submission_supported:
          const: false
        routing_counts:
          $ref: "#/components/schemas/PayrollTestRoutingCounts"
        materials:
          type: array
          items:
            $ref: "#/components/schemas/PayrollTestWorkspaceMaterial"
    PayrollTestRoutingCounts:
      type: object
      additionalProperties: false
      required: [auto_test, review_required, date_unknown]
      properties:
        auto_test:
          type: integer
          minimum: 0
        review_required:
          type: integer
          minimum: 0
        date_unknown:
          type: integer
          minimum: 0
    PayrollTestWorkspaceMaterial:
      type: object
      additionalProperties: false
      required: [company_id, material_id, routing_status, period, material_type, payable, submission_supported]
      properties:
        company_id:
          $ref: "#/components/schemas/PayrollResourceRef"
        material_id:
          $ref: "#/components/schemas/PayrollResourceRef"
        routing_status:
          type: string
          enum: [AUTO_TEST, REVIEW_REQUIRED, DATE_UNKNOWN]
        period:
          type: [string, "null"]
          pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$"
        material_type:
          type: [string, "null"]
        payable:
          const: false
        submission_supported:
          const: false
    PayrollDashboardEnvelope:
      type: object
      additionalProperties: false
      required: [contract_version, entity_ref, company_id, data]
      properties:
        contract_version:
          const: ledgerbridge.payroll-read.v1
        entity_ref:
          type: string
          format: uuid
        company_id:
          $ref: "#/components/schemas/PayrollResourceRef"
        data:
          $ref: "#/components/schemas/PayrollDashboardData"
    PayrollMaterialsEnvelope:
      type: object
      additionalProperties: false
      required: [contract_version, entity_ref, company_id, data]
      properties:
        contract_version:
          const: ledgerbridge.payroll-read.v1
        entity_ref:
          type: string
          format: uuid
        company_id:
          $ref: "#/components/schemas/PayrollResourceRef"
        data:
          $ref: "#/components/schemas/PayrollMaterialListData"
    PayrollBatchesEnvelope:
      type: object
      additionalProperties: false
      required: [contract_version, entity_ref, company_id, data]
      properties:
        contract_version:
          const: ledgerbridge.payroll-read.v1
        entity_ref:
          type: string
          format: uuid
        company_id:
          $ref: "#/components/schemas/PayrollResourceRef"
        data:
          $ref: "#/components/schemas/PayrollBatchListData"
    PayrollVerificationEnvelope:
      type: object
      additionalProperties: false
      required: [contract_version, entity_ref, company_id, data]
      properties:
        contract_version:
          const: ledgerbridge.payroll-read.v1
        entity_ref:
          type: string
          format: uuid
        company_id:
          $ref: "#/components/schemas/PayrollResourceRef"
        data:
          $ref: "#/components/schemas/PayrollVerificationListData"
    PayrollStatusData:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - live_data_ready
        - live_projection_schema
        - payment_operations_exposed
        - projection_revision
        - etag
        - setup_summary
        - capabilities
      properties:
        schema_version:
          const: ledgerbridge.payroll-status.v1
        live_data_ready:
          type: boolean
        live_projection_schema:
          const: payroll-ledgerbridge-live-projection/v1
        payment_operations_exposed:
          const: false
        projection_revision:
          $ref: "#/components/schemas/PayrollProjectionRevision"
        etag:
          $ref: "#/components/schemas/PayrollProjectionEtag"
        setup_summary:
          $ref: "#/components/schemas/PayrollSetupSummary"
        capabilities:
          $ref: "#/components/schemas/PayrollCapabilities"
    PayrollProjectionRevision:
      type: string
      pattern: "^[0-9a-f]{64}$"
    PayrollProjectionEtag:
      type: string
      pattern: '^"[0-9a-f]{64}"$'
    PayrollGeneratedAt:
      type: string
      format: date-time
    PayrollSetupSummary:
      type: object
      additionalProperties: false
      required:
        - provider_connected
        - runtime_mode
        - unassigned_material_count
        - ready_material_count
        - company_mapped_material_count
        - blocking_reason_codes
      properties:
        provider_connected:
          const: true
        runtime_mode:
          const: live-provider
        unassigned_material_count:
          type: integer
          minimum: 0
        ready_material_count:
          type: integer
          minimum: 0
        company_mapped_material_count:
          type: integer
          minimum: 0
        blocking_reason_codes:
          type: array
          uniqueItems: true
          maxItems: 4
          items:
            type: string
            enum:
              - UNASSIGNED_MATERIALS
              - MATERIAL_REVIEW_REQUIRED
              - PAYROLL_BATCH_REQUIRED
              - LIVE_DATA_NOT_READY
    PayrollCapabilities:
      type: object
      additionalProperties: false
      required: [commands_enabled, allowed_actions]
      properties:
        commands_enabled:
          type: boolean
        allowed_actions:
          type: array
          uniqueItems: true
          maxItems: 1
          items:
            const: VERIFY_RECEIPTS
    PayrollDashboardData:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - projection_revision
        - etag
        - generated_at
        - live_data_ready
        - setup_summary
      properties:
        schema_version:
          const: ledgerbridge.payroll-dashboard.v1
        projection_revision:
          $ref: "#/components/schemas/PayrollProjectionRevision"
        etag:
          $ref: "#/components/schemas/PayrollProjectionEtag"
        generated_at:
          $ref: "#/components/schemas/PayrollGeneratedAt"
        live_data_ready:
          type: boolean
        setup_summary:
          $ref: "#/components/schemas/PayrollSetupSummary"
        dashboard:
          $ref: "#/components/schemas/PayrollDashboardMetrics"
      allOf:
        - if:
            properties:
              live_data_ready:
                const: true
          then:
            required: [dashboard]
          else:
            not:
              required: [dashboard]
    PayrollDashboardMetrics:
      type: object
      additionalProperties: false
      required:
        - batch_count
        - material_count
        - materials_needing_review_count
        - verification_attention_count
        - unassigned_material_count
        - net_pay_minor
      properties:
        batch_count:
          type: integer
          minimum: 0
        material_count:
          type: integer
          minimum: 0
        materials_needing_review_count:
          type: integer
          minimum: 0
        verification_attention_count:
          type: integer
          minimum: 0
        unassigned_material_count:
          type: integer
          minimum: 0
        net_pay_minor:
          type: integer
          minimum: 0
    PayrollMaterialListData:
      type: object
      additionalProperties: false
      required: [schema_version, projection_revision, etag, generated_at, items]
      properties:
        schema_version:
          const: ledgerbridge.payroll-material-list.v1
        projection_revision:
          $ref: "#/components/schemas/PayrollProjectionRevision"
        etag:
          $ref: "#/components/schemas/PayrollProjectionEtag"
        generated_at:
          $ref: "#/components/schemas/PayrollGeneratedAt"
        items:
          type: array
          items:
            $ref: "#/components/schemas/PayrollMaterial"
    PayrollMaterial:
      type: object
      additionalProperties: false
      required:
        - company_id
        - material_id
        - material_type
        - period
        - status
        - review_revision
        - payable
        - submission_supported
      properties:
        company_id:
          $ref: "#/components/schemas/PayrollResourceRef"
        material_id:
          $ref: "#/components/schemas/PayrollResourceRef"
        material_type:
          type: [string, "null"]
        period:
          type: [string, "null"]
          pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$"
        status:
          type: string
          minLength: 1
        review_revision:
          type: integer
          minimum: 0
        payable:
          const: false
        submission_supported:
          const: false
    PayrollBatchListData:
      type: object
      additionalProperties: false
      required: [schema_version, projection_revision, etag, generated_at, items]
      properties:
        schema_version:
          const: ledgerbridge.payroll-batch-list.v1
        projection_revision:
          $ref: "#/components/schemas/PayrollProjectionRevision"
        etag:
          $ref: "#/components/schemas/PayrollProjectionEtag"
        generated_at:
          $ref: "#/components/schemas/PayrollGeneratedAt"
        items:
          type: array
          items:
            $ref: "#/components/schemas/PayrollBatch"
    PayrollBatch:
      type: object
      additionalProperties: false
      required:
        - company_id
        - batch_id
        - pay_period
        - revision
        - status
        - payable
        - submission_supported
        - payment_submission_supported
        - lines
      properties:
        company_id:
          $ref: "#/components/schemas/PayrollResourceRef"
        batch_id:
          $ref: "#/components/schemas/PayrollResourceRef"
        pay_period:
          type: string
          pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$"
        revision:
          type: integer
          minimum: 1
        status:
          type: string
          minLength: 1
        payable:
          const: false
        submission_supported:
          const: false
        payment_submission_supported:
          const: false
        lines:
          type: array
          items:
            $ref: "#/components/schemas/PayrollBatchLine"
        audit_closure:
          $ref: "#/components/schemas/PayrollBatchAuditClosure"
    PayrollBatchLine:
      type: object
      additionalProperties: false
      required:
        - company_id
        - employee_id
        - employee_display
        - account_id
        - account_display
        - net_pay_minor
      properties:
        company_id:
          $ref: "#/components/schemas/PayrollResourceRef"
        employee_id:
          $ref: "#/components/schemas/PayrollResourceRef"
        employee_display:
          type: string
        account_id:
          $ref: "#/components/schemas/PayrollResourceRef"
        account_display:
          type: string
        net_pay_minor:
          type: integer
          minimum: 0
    PayrollBatchAuditClosure:
      type: object
      additionalProperties: false
      required: [audit_event_id, audit_hash]
      properties:
        audit_event_id:
          $ref: "#/components/schemas/PayrollResourceRef"
        audit_hash:
          $ref: "#/components/schemas/PayrollProjectionRevision"
    PayrollVerificationListData:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - projection_revision
        - etag
        - generated_at
        - items
        - available_evidence
      properties:
        schema_version:
          const: ledgerbridge.payroll-verification-list.v1
        projection_revision:
          $ref: "#/components/schemas/PayrollProjectionRevision"
        etag:
          $ref: "#/components/schemas/PayrollProjectionEtag"
        generated_at:
          $ref: "#/components/schemas/PayrollGeneratedAt"
        items:
          type: array
          items:
            $ref: "#/components/schemas/PayrollVerification"
        available_evidence:
          type: array
          items:
            $ref: "#/components/schemas/PayrollAvailableEvidence"
    PayrollVerification:
      type: object
      additionalProperties: false
      required:
        - company_id
        - verification_id
        - batch_id
        - status
        - source_artifact_ids
        - results
        - payable
        - submission_supported
        - payment_submission_supported
      properties:
        company_id:
          $ref: "#/components/schemas/PayrollResourceRef"
        verification_id:
          $ref: "#/components/schemas/PayrollResourceRef"
        batch_id:
          $ref: "#/components/schemas/PayrollResourceRef"
        status:
          type: string
          minLength: 1
        source_artifact_ids:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/PayrollResourceRef"
        results:
          type: array
          items:
            $ref: "#/components/schemas/PayrollVerificationResult"
        payable:
          const: false
        submission_supported:
          const: false
        payment_submission_supported:
          const: false
    PayrollVerificationResult:
      type: object
      additionalProperties: false
      required:
        - company_id
        - employee_id
        - employee_display
        - account_id
        - account_display
        - status
      properties:
        company_id:
          $ref: "#/components/schemas/PayrollResourceRef"
        employee_id:
          $ref: "#/components/schemas/PayrollResourceRef"
        employee_display:
          type: string
        account_id:
          $ref: "#/components/schemas/PayrollResourceRef"
        account_display:
          type: string
        status:
          type: string
          minLength: 1
    PayrollAvailableEvidence:
      type: object
      additionalProperties: false
      required: [company_id, artifact_id, period, evidence_type, status, display_label]
      properties:
        company_id:
          $ref: "#/components/schemas/PayrollResourceRef"
        artifact_id:
          $ref: "#/components/schemas/PayrollResourceRef"
        period:
          type: string
          pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$"
        evidence_type:
          type: string
          enum: [MYBANK_STATEMENT, BOC_RECEIPT, WECHAT_RECEIPT, CASH_SIGNOFF, BANK_RECEIPT]
        status:
          const: READY_FOR_MATCHING
        display_label:
          type: string
          pattern: "^(MYBANK_STATEMENT|BOC_RECEIPT|WECHAT_RECEIPT|CASH_SIGNOFF|BANK_RECEIPT) · [0-9]{4}-(0[1-9]|1[0-2])$"
    PayrollVerificationRequest:
      type: object
      additionalProperties: false
      required: [expected_revision, reason_code, source_artifact_ids]
      properties:
        expected_revision:
          type: integer
          minimum: 1
        reason_code:
          const: MANUAL_DISBURSEMENT_VERIFICATION
        source_artifact_ids:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            $ref: "#/components/schemas/PayrollResourceRef"
    PayrollCommandResult:
      type: object
      additionalProperties: false
      required: [contract_version, entity_ref, company_id, action, resource_ref, replayed, data]
      properties:
        contract_version:
          const: ledgerbridge.payroll-command-result.v1
        entity_ref:
          type: string
          format: uuid
        company_id:
          $ref: "#/components/schemas/PayrollResourceRef"
        action:
          const: payroll.batch.verify-receipts
        resource_ref:
          $ref: "#/components/schemas/PayrollResourceRef"
        replayed:
          type: boolean
        data:
          $ref: "#/components/schemas/PayrollCommandReceipt"
    PayrollCommandReceipt:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - company_id
        - resource_id
        - action
        - audit_event_id
        - audit_hash
        - occurred_at
        - idempotency_key
        - replayed
        - audit_closure
      properties:
        schema_version:
          const: payroll-ledgerbridge-command-receipt/v1
        company_id:
          $ref: "#/components/schemas/PayrollResourceRef"
        resource_id:
          $ref: "#/components/schemas/PayrollResourceRef"
        action:
          const: payroll.receipts.verify
        audit_event_id:
          $ref: "#/components/schemas/PayrollResourceRef"
        audit_hash:
          $ref: "#/components/schemas/PayrollProjectionRevision"
        occurred_at:
          type: string
          format: date-time
        idempotency_key:
          type: string
          format: uuid
        replayed:
          type: boolean
        audit_closure:
          $ref: "#/components/schemas/PayrollCommandAuditClosure"
    PayrollCommandAuditClosure:
      type: object
      additionalProperties: false
      required:
        - company_id
        - resource_id
        - action
        - actor_subject
        - actor_id
        - audit_event_id
        - audit_hash
        - occurred_at
      properties:
        company_id:
          $ref: "#/components/schemas/PayrollResourceRef"
        resource_id:
          $ref: "#/components/schemas/PayrollResourceRef"
        action:
          const: payroll.receipts.verify
        actor_subject:
          $ref: "#/components/schemas/PayrollStableIdentifier"
        actor_id:
          $ref: "#/components/schemas/PayrollStableIdentifier"
        audit_event_id:
          $ref: "#/components/schemas/PayrollResourceRef"
        audit_hash:
          $ref: "#/components/schemas/PayrollProjectionRevision"
        occurred_at:
          type: string
          format: date-time
    AuthStatus:
      type: object
      additionalProperties: false
      required: [authenticated, setup_required, passkey_registered, recovery_setup_required, recovery_pending]
      properties:
        authenticated:
          type: boolean
        setup_required:
          type: boolean
        passkey_registered:
          type: boolean
        recovery_setup_required:
          type: boolean
        recovery_pending:
          type: boolean
          description: Old Passkeys are frozen until recovery finishes with a replacement credential.
        principal:
          type: string
          maxLength: 200
    AuthResult:
      type: object
      additionalProperties: false
      required: [authenticated, setup_required, passkey_registered, recovery_setup_required, recovery_pending]
      properties:
        authenticated:
          type: boolean
        setup_required:
          type: boolean
        passkey_registered:
          type: boolean
        recovery_setup_required:
          type: boolean
        recovery_pending:
          type: boolean
        principal:
          type: string
          maxLength: 200
        recovery_codes:
          type: array
          maxItems: 10
          items:
            type: string
            minLength: 32
            maxLength: 64
        csrf_token:
          type: string
          description: Returned with newly issued normal or restricted sessions; never persisted by the browser.
        expires_at:
          type: string
          format: date-time
    PasskeyAdditionResult:
      type: object
      additionalProperties: false
      required: [added, passkey_count]
      properties:
        added:
          type: boolean
          const: true
        passkey_count:
          type: integer
          minimum: 2
          maximum: 10
    WebAuthnOptions:
      type: object
      description: Standards-shaped WebAuthn options; binary values use unpadded base64url.
      additionalProperties: true
      required: [challenge]
      properties:
        challenge:
          type: string
          minLength: 32
    WebAuthnCredential:
      type: object
      description: Browser PublicKeyCredential JSON; ArrayBuffer fields use unpadded base64url.
      additionalProperties: true
      required: [id, rawId, type, response, clientExtensionResults]
      properties:
        id:
          type: string
        rawId:
          type: string
        type:
          const: public-key
        response:
          type: object
          additionalProperties: true
        clientExtensionResults:
          type: object
          additionalProperties: true
    Session:
      type: object
      additionalProperties: false
      required: [principal, csrf_token, expires_at]
      properties:
        principal:
          type: string
          maxLength: 200
        csrf_token:
          type: string
        expires_at:
          type: string
          format: date-time
    CandidateStatus:
      type: string
      enum: [INCOMPLETE, PENDING, CONFLICTED, CONFIRMED, IGNORED, SUPERSEDED]
    ClassificationGroupPage:
      type: object
      additionalProperties: false
      required: [contract_version, items, next_cursor]
      properties:
        contract_version:
          const: ledgerbridge.classification-groups.v1
        items:
          type: array
          maxItems: 10000
          items:
            $ref: "#/components/schemas/ClassificationGroup"
        next_cursor:
          type: "null"
    ClassificationGroup:
      type: object
      additionalProperties: false
      required: [contract_version, group_ref, accounting_month, conditions, members, batch_member_count, one_click_member_count, terminal_statuses, terminal_classifications, rule_learning_eligible, rule_learning_blocks, active_rule]
      properties:
        contract_version:
          const: ledgerbridge.classification-group.v1
        group_ref:
          type: string
          pattern: "^cg_[0-9a-f]{32}$"
        accounting_month:
          type: string
          pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$"
        conditions:
          $ref: "#/components/schemas/SimilarityConditions"
        members:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ClassificationGroupMember"
        batch_member_count:
          type: integer
          minimum: 0
        one_click_member_count:
          type: integer
          minimum: 0
        terminal_statuses:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/CandidateStatus"
        terminal_classifications:
          type: array
          uniqueItems: true
          items:
            type: string
        rule_learning_eligible:
          type: boolean
          description: Informational Core gate only; Web exposes no rule-learning command.
        rule_learning_blocks:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [PROVISIONAL_BASIS, TERMINAL_DECISION_CONFLICT, REVIEW_RISK_PRESENT, AMOUNT_OUTLIER, NO_CONFIRMED_SOURCE]
        active_rule:
          type: "null"
          description: Rule persistence and mutation are outside this slice and are not exposed by Web.
    SimilarityConditions:
      type: object
      additionalProperties: false
      required: [key_version, entity_ref, source_system, source_kind, platform, direction, transaction_type, counterparty_key, counterparty_label, counterparty_basis, funding_instrument, transaction_status, currency, risk_signature]
      properties:
        key_version:
          const: ledgerbridge.classification-key.v1
        entity_ref:
          type: string
          format: uuid
        source_system:
          type: string
          minLength: 1
          maxLength: 100
        source_kind:
          type: string
          minLength: 1
          maxLength: 64
        platform:
          type: string
          minLength: 1
          maxLength: 100
        direction:
          type: string
          enum: [INFLOW, OUTFLOW, NEUTRAL]
        transaction_type:
          type: string
          minLength: 1
          maxLength: 100
        counterparty_key:
          type: string
          minLength: 1
          maxLength: 200
        counterparty_label:
          type: string
          minLength: 1
          maxLength: 200
        counterparty_basis:
          type: string
          enum: [REGISTRY_COUNTERPARTY, EXACT_PLATFORM_SUMMARY_V1]
        funding_instrument:
          type: string
          minLength: 1
          maxLength: 200
        transaction_status:
          type: string
          minLength: 1
          maxLength: 100
        currency:
          type: string
          const: CNY
        risk_signature:
          type: array
          maxItems: 6
          uniqueItems: true
          items:
            $ref: "#/components/schemas/ClassificationRiskCode"
    ClassificationRiskCode:
      type: string
      enum: [FUNDING_STATEMENT_REQUIRED, HOTEL_PAYOUT_STATEMENT_REQUIRED, RELATED_ACCOUNT_STATEMENT_REQUIRED, REVERSAL_MATCH_REQUIRED, TRANSFER_REVIEW_REQUIRED, UNSETTLED_TRANSACTION]
    ClassificationGroupMember:
      type: object
      additionalProperties: false
      required: [candidate_ref, short_id, revision, status, amount_minor, accounting_month, confidence_basis_points, review_risk_codes, amount_outlier, batch_eligible, one_click_eligible, exclusion_codes]
      properties:
        candidate_ref:
          type: string
          format: uuid
        short_id:
          type: string
          minLength: 1
          maxLength: 100
        revision:
          type: integer
          minimum: 1
        status:
          $ref: "#/components/schemas/CandidateStatus"
        amount_minor:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        accounting_month:
          type: string
          pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$"
        confidence_basis_points:
          type: integer
          minimum: 0
          maximum: 10000
        review_risk_codes:
          type: array
          maxItems: 6
          uniqueItems: true
          items:
            $ref: "#/components/schemas/ClassificationRiskCode"
        amount_outlier:
          type: boolean
        batch_eligible:
          type: boolean
        one_click_eligible:
          type: boolean
        exclusion_codes:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [NOT_PENDING, LOW_CONFIDENCE, BLOCKED, STRUCTURAL_RISK, AMOUNT_OUTLIER]
    ClassificationTarget:
      type: object
      additionalProperties: false
      required: [business_unit_ref, category_code]
      properties:
        business_unit_ref:
          type: string
          minLength: 1
          maxLength: 100
        category_code:
          type: string
          minLength: 1
          maxLength: 100
    ClassificationBatchRequest:
      type: object
      additionalProperties: false
      required: [source_candidate_ref, accounting_month, target, members, reason, acknowledged_risk_codes]
      properties:
        source_candidate_ref:
          type: string
          format: uuid
        accounting_month:
          type: string
          pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$"
        target:
          $ref: "#/components/schemas/ClassificationTarget"
        members:
          type: array
          minItems: 2
          maxItems: 100
          uniqueItems: true
          items:
            type: object
            additionalProperties: false
            required: [candidate_ref, expected_revision]
            properties:
              candidate_ref:
                type: string
                format: uuid
              expected_revision:
                type: integer
                minimum: 1
        reason:
          type: string
          minLength: 1
          maxLength: 1000
        acknowledged_risk_codes:
          type: array
          maxItems: 6
          uniqueItems: true
          items:
            $ref: "#/components/schemas/ClassificationRiskCode"
    ClassificationBatchReceipt:
      type: object
      additionalProperties: false
      required: [contract_version, operation_id, replayed, group_ref, accounting_month, source_candidate_ref, target, acknowledged_risk_codes, results]
      properties:
        contract_version:
          const: ledgerbridge.classification-batch.v1
        operation_id:
          type: string
          format: uuid
        replayed:
          type: boolean
        group_ref:
          type: string
          pattern: "^cg_[0-9a-f]{32}$"
        accounting_month:
          type: string
          pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$"
        source_candidate_ref:
          type: string
          format: uuid
        target:
          $ref: "#/components/schemas/ClassificationTarget"
        acknowledged_risk_codes:
          type: array
          maxItems: 6
          uniqueItems: true
          items:
            $ref: "#/components/schemas/ClassificationRiskCode"
        results:
          type: array
          minItems: 2
          maxItems: 100
          items:
            $ref: "#/components/schemas/ClassificationBatchMemberResult"
    ClassificationBatchMemberResult:
      type: object
      additionalProperties: false
      required: [candidate_ref, operation_id, status, candidate, events]
      properties:
        candidate_ref:
          type: string
          format: uuid
        operation_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [APPLIED, REPLAYED]
        candidate:
          $ref: "#/components/schemas/Candidate"
        events:
          type: array
          minItems: 1
          maxItems: 2
          items:
            $ref: "#/components/schemas/ReviewEvent"
    Candidate:
      allOf:
        - $ref: "#/components/schemas/CandidateFields"
      unevaluatedProperties: false
    CandidateFields:
      type: object
      required:
        - id
        - short_id
        - revision
        - status
        - source_channel
        - source_message_id
        - received_at
        - business_unit
        - business_unit_ref
        - category
        - category_code
        - amount_minor
        - currency
        - accounting_month
        - summary
        - confidence_basis_points
        - evidence
        - blockers
      properties:
        id:
          type: string
          format: uuid
        short_id:
          type: string
          pattern: "^C-[A-Z0-9]{4,8}$"
        revision:
          type: integer
          minimum: 1
        status:
          $ref: "#/components/schemas/CandidateStatus"
        source_channel:
          type: string
          enum: [telegram, dingtalk, weixin]
        source_message_id:
          type: string
          minLength: 1
          maxLength: 500
        received_at:
          type: string
          format: date-time
        business_unit:
          type: string
          minLength: 1
          maxLength: 200
        business_unit_ref:
          type: [string, "null"]
          minLength: 1
          maxLength: 100
        category:
          type: string
          minLength: 1
          maxLength: 200
        category_code:
          type: [string, "null"]
          minLength: 1
          maxLength: 100
        amount_minor:
          type: integer
          format: int64
          minimum: -9007199254740991
          maximum: 9007199254740991
        currency:
          type: string
          const: CNY
        accounting_month:
          type: [string, "null"]
          pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$"
        summary:
          type: string
          maxLength: 1000
        confidence_basis_points:
          type: integer
          minimum: 0
          maximum: 10000
        evidence:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/EvidenceReference"
        blockers:
          type: array
          items:
            $ref: "#/components/schemas/Blocker"
    CandidateDetail:
      allOf:
        - $ref: "#/components/schemas/CandidateFields"
        - type: object
          required: [review_events]
          properties:
            review_events:
              type: array
              items:
                $ref: "#/components/schemas/ReviewEvent"
      unevaluatedProperties: false
    EvidenceReference:
      type: object
      additionalProperties: false
      required: [id, kind, media_type, sha256, original_filename]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [message, attachment]
        media_type:
          type: string
          maxLength: 200
        sha256:
          type: string
          pattern: "^[a-f0-9]{64}$"
        original_filename:
          type: [string, "null"]
          maxLength: 500
        unlock_status:
          type: string
          enum: [NOT_REQUIRED, PASSWORD_REQUIRED, UNLOCKED]
        source_ref:
          type: [string, "null"]
          format: uuid
          description: Opaque canonical reference; required when unlock_status is PASSWORD_REQUIRED.
    EvidencePreview:
      type: object
      description: >-
        Bounded inert preview. kind selects image, text, spreadsheet, or an
        unsupported fallback; active document content is never emitted inline.
      required: [kind, filename]
      properties:
        kind:
          type: string
          enum: [image, text, spreadsheet, unsupported]
        filename:
          type: string
          maxLength: 200
        media_type:
          type: string
          enum: [image/jpeg, image/png, image/gif, image/webp]
        data_url:
          type: string
          maxLength: 12000000
        text:
          type: string
          maxLength: 262144
        reference:
          type: [string, "null"]
          maxLength: 64
        matched:
          type: boolean
        records:
          type: array
          maxItems: 4
          items:
            type: object
            required: [sheet, row_number, header_row_number, fields]
            properties:
              sheet:
                type: string
                maxLength: 200
              row_number:
                type: integer
                minimum: 1
              header_row_number:
                type: [integer, "null"]
                minimum: 1
              fields:
                type: array
                maxItems: 30
                items:
                  type: object
                  required: [label, value]
                  properties:
                    label:
                      type: string
                      maxLength: 1000
                    value:
                      type: string
                      maxLength: 1000
        fallback:
          type: [object, "null"]
        reason:
          type: string
          maxLength: 500
    Blocker:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          enum: [MISSING_ACCOUNTING_MONTH, DUPLICATE_MESSAGE, DUPLICATE_ATTACHMENT, BUSINESS_KEY_CONFLICT]
        message:
          type: string
          maxLength: 500
    CandidateDecisionRequest:
      oneOf:
        - $ref: "#/components/schemas/ConfirmDecision"
        - $ref: "#/components/schemas/CorrectAndConfirmDecision"
        - $ref: "#/components/schemas/IgnoreDecision"
        - $ref: "#/components/schemas/ResolveConflictDecision"
      discriminator:
        propertyName: decision
    DecisionBase:
      type: object
      required: [decision, expected_revision, reason]
      properties:
        decision:
          type: string
        expected_revision:
          type: integer
          minimum: 1
        reason:
          type: string
          minLength: 1
          maxLength: 1000
    ConfirmDecision:
      allOf:
        - $ref: "#/components/schemas/DecisionBase"
        - type: object
          properties:
            decision:
              const: CONFIRM
      unevaluatedProperties: false
    IgnoreDecision:
      allOf:
        - $ref: "#/components/schemas/DecisionBase"
        - type: object
          properties:
            decision:
              const: IGNORE
      unevaluatedProperties: false
    CorrectAndConfirmDecision:
      allOf:
        - $ref: "#/components/schemas/DecisionBase"
        - type: object
          required: [corrections]
          properties:
            decision:
              const: CORRECT_AND_CONFIRM
            corrections:
              $ref: "#/components/schemas/CorrectionSet"
      unevaluatedProperties: false
    ResolveConflictDecision:
      allOf:
        - $ref: "#/components/schemas/DecisionBase"
        - type: object
          required: [conflict_resolution]
          properties:
            decision:
              const: RESOLVE_CONFLICT
            conflict_resolution:
              type: string
              minLength: 1
              maxLength: 1000
            corrections:
              $ref: "#/components/schemas/CorrectionSet"
      unevaluatedProperties: false
    CorrectionSet:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        business_unit_ref:
          type: string
          minLength: 1
          maxLength: 100
        category_code:
          type: string
          minLength: 1
          maxLength: 100
        amount_minor:
          type: integer
          format: int64
          minimum: -9007199254740991
          maximum: 9007199254740991
        accounting_month:
          type: string
          pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$"
    AccountingDimensions:
      type: object
      additionalProperties: false
      required: [contract_version, business_units, categories]
      properties:
        contract_version:
          const: ledgerbridge.accounting-dimensions.v1
        business_units:
          type: array
          maxItems: 1000
          items:
            type: object
            additionalProperties: false
            required: [ref, label]
            properties:
              ref:
                type: string
                minLength: 1
                maxLength: 100
              label:
                type: string
                minLength: 1
                maxLength: 200
        categories:
          type: array
          maxItems: 1000
          items:
            type: object
            additionalProperties: false
            required: [code, label]
            properties:
              code:
                type: string
                minLength: 1
                maxLength: 100
              label:
                type: string
                minLength: 1
                maxLength: 200
    ReviewEvent:
      type: object
      additionalProperties: false
      required:
        - id
        - candidate_id
        - sequence
        - from_revision
        - to_revision
        - decision
        - actor
        - reason
        - changes
        - conflict_resolution
        - created_at
      properties:
        id:
          type: string
          format: uuid
        candidate_id:
          type: string
          format: uuid
        sequence:
          type: integer
          minimum: 1
        from_revision:
          type: integer
          minimum: 1
        to_revision:
          type: integer
          minimum: 2
        decision:
          type: string
          enum: [CONFIRM, CORRECT_AND_CONFIRM, IGNORE, RESOLVE_CONFLICT]
        actor:
          type: string
          maxLength: 200
        reason:
          type: string
          maxLength: 1000
        changes:
          type: array
          items:
            $ref: "#/components/schemas/FieldChange"
        conflict_resolution:
          type: [string, "null"]
          maxLength: 1000
        created_at:
          type: string
          format: date-time
    FieldChange:
      type: object
      additionalProperties: false
      required: [field, previous_value, new_value, identity_changed]
      properties:
        field:
          type: string
          enum: [business_unit, category, amount_minor, accounting_month, status]
        previous_value:
          type: [string, integer, "null"]
        new_value:
          type: [string, integer, "null"]
        identity_changed:
          type: boolean
          description: True when the stable accounting identity changed, including when its display label did not.
    Reconciliation:
      type: object
      additionalProperties: false
      required: [accounting_month, revision, ready, blockers, business_units]
      properties:
        accounting_month:
          type: string
        revision:
          type: integer
          minimum: 1
        ready:
          type: boolean
        blockers:
          type: array
          items:
            $ref: "#/components/schemas/Blocker"
        business_units:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name, amounts_minor]
            properties:
              name:
                type: string
              amounts_minor:
                type: object
                additionalProperties:
                  type: integer
                  format: int64
    CompanyReportsResponse:
      type: object
      additionalProperties: false
      required: [contract_version, from_month, to_month, layers]
      properties:
        contract_version:
          const: ledgerbridge.company-reports-bff.v1
        from_month:
          type: string
          pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$"
        to_month:
          type: string
          pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$"
        layers:
          type: array
          minItems: 3
          maxItems: 3
          description: Exactly one layer for each reporting basis; layers are never added together. All three layers have the same strictly sorted company_ref set and identical company identity.
          items:
            $ref: "#/components/schemas/CompanyReportLayer"
    CompanyReportLayer:
      type: object
      additionalProperties: false
      required: [contract_version, basis, from_month, to_month, items]
      properties:
        contract_version:
          const: ledgerbridge.company-report.v1
        basis:
          type: string
          enum: [CONFIRMED_CANDIDATE, ACCOUNT_STATEMENT, POSTED_LEDGER]
        from_month:
          type: string
          pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$"
        to_month:
          type: string
          pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$"
        items:
          type: array
          maxItems: 50
          description: Companies are unique and strictly ascending by canonical company_ref UUID.
          items:
            $ref: "#/components/schemas/CompanyReportCompany"
    CompanyReportCompany:
      type: object
      additionalProperties: false
      required: [company_ref, company_name, currency, business_unit_breakdown_status, metrics, pending_review_count, attribution_pending_count, missing_material_count, taxonomy_version, balance, months]
      properties:
        company_ref:
          type: string
          format: uuid
        company_name:
          type: string
          minLength: 1
          maxLength: 200
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
        business_unit_breakdown_status:
          type: string
          enum: [AVAILABLE, EMPTY, UNAVAILABLE_ATTRIBUTION_PENDING, UNAVAILABLE_MISSING_SNAPSHOT]
          description: Must exactly summarize months. No months is EMPTY; ACCOUNT_STATEMENT prioritizes attribution pending then missing snapshot; POSTED_LEDGER prioritizes missing snapshot; otherwise any AVAILABLE month yields AVAILABLE and all remaining cases yield EMPTY. CONFIRMED_CANDIDATE permits only AVAILABLE or EMPTY.
        metrics:
          $ref: "#/components/schemas/CompanyReportMetrics"
        pending_review_count:
          $ref: "#/components/schemas/SafeCount"
        attribution_pending_count:
          $ref: "#/components/schemas/SafeCount"
        missing_material_count:
          $ref: "#/components/schemas/NullableSafeCount"
        taxonomy_version:
          type: [string, "null"]
          maxLength: 200
          description: Must be non-null exactly when missing_material_count is non-null.
        balance:
          $ref: "#/components/schemas/UnavailableBalance"
        months:
          type: array
          maxItems: 24
          description: Months are unique and strictly ascending by YYYY-MM.
          items:
            $ref: "#/components/schemas/CompanyReportMonth"
    CompanyReportMonth:
      type: object
      additionalProperties: false
      required: [month, metrics, pending_review_count, attribution_pending_count, missing_material_count, taxonomy_version, balance, business_unit_breakdown_status, business_units]
      properties:
        month:
          type: string
          pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$"
        metrics:
          $ref: "#/components/schemas/CompanyReportMetrics"
        pending_review_count:
          $ref: "#/components/schemas/SafeCount"
        attribution_pending_count:
          $ref: "#/components/schemas/SafeCount"
        missing_material_count:
          $ref: "#/components/schemas/NullableSafeCount"
        taxonomy_version:
          type: [string, "null"]
          maxLength: 200
          description: Must be non-null exactly when missing_material_count is non-null.
        balance:
          $ref: "#/components/schemas/UnavailableBalance"
        business_unit_breakdown_status:
          type: string
          enum: [AVAILABLE, EMPTY, UNAVAILABLE_ATTRIBUTION_PENDING, UNAVAILABLE_MISSING_SNAPSHOT]
          description: AVAILABLE requires a non-empty sorted array; EMPTY requires an empty array. ACCOUNT_STATEMENT alone may use UNAVAILABLE_ATTRIBUTION_PENDING with null. POSTED_LEDGER alone may use UNAVAILABLE_MISSING_SNAPSHOT with null.
        business_units:
          type: [array, "null"]
          maxItems: 50
          description: When present, business units are unique and strictly ascending by business_unit_ref. Null means the declared breakdown is unavailable, never zero.
          items:
            $ref: "#/components/schemas/CompanyReportBusinessUnit"
    CompanyReportBusinessUnit:
      type: object
      additionalProperties: false
      required: [business_unit_ref, business_unit_label, metrics, pending_review_count, attribution_pending_count, missing_material_count, taxonomy_version, balance]
      properties:
        business_unit_ref:
          type: string
          minLength: 1
          maxLength: 200
        business_unit_label:
          type: string
          minLength: 1
          maxLength: 200
        metrics:
          $ref: "#/components/schemas/CompanyReportMetrics"
        pending_review_count:
          $ref: "#/components/schemas/SafeCount"
        attribution_pending_count:
          $ref: "#/components/schemas/SafeCount"
        missing_material_count:
          $ref: "#/components/schemas/NullableSafeCount"
        taxonomy_version:
          type: [string, "null"]
          maxLength: 200
          description: Must be non-null exactly when missing_material_count is non-null.
        balance:
          $ref: "#/components/schemas/UnavailableBalance"
    CompanyReportMetrics:
      oneOf:
        - $ref: "#/components/schemas/ConfirmedCandidateMetrics"
        - $ref: "#/components/schemas/AccountStatementMetrics"
        - $ref: "#/components/schemas/PostedLedgerMetrics"
      discriminator:
        propertyName: basis
    ConfirmedCandidateMetrics:
      type: object
      additionalProperties: false
      required: [basis, confirmed_positive_minor, confirmed_negative_minor, confirmed_net_minor, confirmed_count, source_count]
      description: confirmed_net_minor must equal confirmed_positive_minor plus confirmed_negative_minor; source_count must not exceed confirmed_count.
      properties:
        basis:
          const: CONFIRMED_CANDIDATE
        confirmed_positive_minor:
          $ref: "#/components/schemas/SafeNonnegativeMinor"
        confirmed_negative_minor:
          type: integer
          minimum: -9007199254740991
          maximum: 0
        confirmed_net_minor:
          $ref: "#/components/schemas/SafeSignedMinor"
        confirmed_count:
          $ref: "#/components/schemas/SafeCount"
        source_count:
          $ref: "#/components/schemas/SafeCount"
    AccountStatementMetrics:
      type: object
      additionalProperties: false
      required: [basis, cash_inflow_minor, cash_outflow_minor, net_cash_flow_minor, confirmed_transaction_count, statement_count]
      description: net_cash_flow_minor must equal cash_inflow_minor minus cash_outflow_minor and is not profit; statement_count must not exceed confirmed_transaction_count.
      properties:
        basis:
          const: ACCOUNT_STATEMENT
        cash_inflow_minor:
          $ref: "#/components/schemas/SafeNonnegativeMinor"
        cash_outflow_minor:
          $ref: "#/components/schemas/SafeNonnegativeMinor"
        net_cash_flow_minor:
          $ref: "#/components/schemas/SafeSignedMinor"
        confirmed_transaction_count:
          $ref: "#/components/schemas/SafeCount"
        statement_count:
          $ref: "#/components/schemas/SafeCount"
    PostedLedgerMetrics:
      type: object
      additionalProperties: false
      required: [basis, revenue_minor, expense_minor, profit_minor, posted_entry_count, source_count]
      description: profit_minor must equal revenue_minor minus expense_minor; source_count must not exceed posted_entry_count; only this basis is a formal financial total.
      properties:
        basis:
          const: POSTED_LEDGER
        revenue_minor:
          $ref: "#/components/schemas/SafeNonnegativeMinor"
        expense_minor:
          $ref: "#/components/schemas/SafeNonnegativeMinor"
        profit_minor:
          $ref: "#/components/schemas/SafeSignedMinor"
        posted_entry_count:
          $ref: "#/components/schemas/SafeCount"
        source_count:
          $ref: "#/components/schemas/SafeCount"
    SafeCount:
      type: integer
      minimum: 0
      maximum: 9007199254740991
    NullableSafeCount:
      type: [integer, "null"]
      minimum: 0
      maximum: 9007199254740991
    SafeNonnegativeMinor:
      type: integer
      minimum: 0
      maximum: 9007199254740991
    SafeSignedMinor:
      type: integer
      minimum: -9007199254740991
      maximum: 9007199254740991
    UnavailableBalance:
      type: object
      additionalProperties: false
      required: [balance_basis, opening_balance_minor, closing_balance_minor, gap]
      properties:
        balance_basis:
          const: UNAVAILABLE
        opening_balance_minor:
          type: "null"
        closing_balance_minor:
          type: "null"
        gap:
          const: AUTHORITATIVE_BALANCE_UNAVAILABLE
    OriginalReconciliation:
      type: object
      additionalProperties: false
      required:
        - contract_version
        - taxonomy_version
        - layout_version
        - mapping_version
        - is_complete
        - posted_ledger_complete
        - projection_gaps
        - month
        - scope
        - columns
        - rows
        - totals
        - pending_review_count
        - confirmed_pending_posting_count
        - missing_material_count
        - unmapped_confirmed_count
        - sources
      properties:
        contract_version:
          type: string
          const: ledgerbridge.original-reconciliation.v1
        taxonomy_version:
          type: string
          const: ledgerbridge.financial-foundation-blocker-taxonomy.v1
        layout_version:
          type: string
          minLength: 1
          maxLength: 100
        mapping_version:
          type: string
          minLength: 1
          maxLength: 100
        is_complete:
          type: boolean
          description: False whenever any review, material, mapping, GAP, or balance input is missing.
        posted_ledger_complete:
          type: boolean
          description: False means all POSTED total fields are null and must not be presented as zero.
        projection_gaps:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [MISSING_TIME_GRANULARITY, MISSING_BUSINESS_UNIT_ATTRIBUTION]
          description: Layout-independent gaps; Web must not infer missing subperiod or historical unit attribution.
        month:
          type: string
          pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$"
        scope:
          type: object
          additionalProperties: false
          required: [entity_ref, business_unit_ref]
          properties:
            entity_ref:
              type: string
              format: uuid
            business_unit_ref:
              type: string
              minLength: 1
              maxLength: 100
        columns:
          type: array
          minItems: 13
          maxItems: 13
          items:
            $ref: "#/components/schemas/OriginalReconciliationColumn"
        rows:
          type: array
          minItems: 40
          maxItems: 40
          items:
            $ref: "#/components/schemas/OriginalReconciliationRow"
        totals:
          $ref: "#/components/schemas/OriginalReconciliationTotals"
        pending_review_count:
          type: integer
          minimum: 0
        confirmed_pending_posting_count:
          type: integer
          minimum: 0
          description: Confirmed facts awaiting posting; excluded from POSTED totals.
        missing_material_count:
          type: integer
          minimum: 0
        unmapped_confirmed_count:
          type: integer
          minimum: 0
        sources:
          type: array
          items:
            $ref: "#/components/schemas/OriginalReconciliationSource"
    OriginalReconciliationColumn:
      type: object
      additionalProperties: false
      required: [column, ordinal, role]
      properties:
        column:
          type: string
          enum: [A, B, C, D, E, F, G, H, I, J, K, L, M]
        ordinal:
          type: integer
          minimum: 1
          maximum: 13
        role:
          type: string
          enum: [MAIN, SPACER, DETAIL]
    OriginalReconciliationRow:
      type: object
      additionalProperties: false
      required: [row_number, cells]
      properties:
        row_number:
          type: integer
          minimum: 1
          maximum: 40
        cells:
          type: array
          minItems: 13
          maxItems: 13
          items:
            $ref: "#/components/schemas/OriginalReconciliationCell"
    OriginalReconciliationCell:
      type: object
      description: GAP cells use gap_code with label null; only LABEL cells carry label text.
      additionalProperties: false
      required: [coordinate, column, row_number, kind, label, amount_minor, currency, gap_code, source_fact_refs]
      properties:
        coordinate:
          type: string
          pattern: "^[A-M]([1-9]|[1-3][0-9]|40)$"
        column:
          type: string
          enum: [A, B, C, D, E, F, G, H, I, J, K, L, M]
        row_number:
          type: integer
          minimum: 1
          maximum: 40
        kind:
          type: string
          enum: [BLANK, LABEL, AMOUNT, GAP]
        label:
          type: [string, "null"]
          minLength: 1
          maxLength: 200
        amount_minor:
          type: [integer, "null"]
          format: int64
        currency:
          type: [string, "null"]
          enum: [CNY, null]
        gap_code:
          type: [string, "null"]
          enum: [MISSING_LEGACY_SLOT_MAPPING, MISSING_BALANCE_MAPPING, MISSING_ECONOMIC_EFFECT, POSTED_LEDGER_UNAVAILABLE, null]
        source_fact_refs:
          type: array
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 200
    OriginalReconciliationTotals:
      type: object
      additionalProperties: false
      required:
        - posted_income_minor
        - posted_expense_minor
        - posted_profit_minor
        - opening_balance_minor
        - closing_balance_minor
        - mapped_cell_count
        - confirmed_candidate_amount_minor
        - posted_amount_minor
        - currency
      properties:
        posted_income_minor:
          type: [integer, "null"]
          format: int64
        posted_expense_minor:
          type: [integer, "null"]
          format: int64
        posted_profit_minor:
          type: [integer, "null"]
          format: int64
          description: Core-validated posted_income_minor minus posted_expense_minor.
        opening_balance_minor:
          type: [integer, "null"]
          format: int64
        closing_balance_minor:
          type: [integer, "null"]
          format: int64
        mapped_cell_count:
          type: integer
          minimum: 0
          maximum: 520
        confirmed_candidate_amount_minor:
          type: integer
          format: int64
          description: Signed audit amount for confirmed facts; not a posted P&L total.
        posted_amount_minor:
          type: [integer, "null"]
          format: int64
          description: Signed audit amount for posted sources.
        currency:
          type: string
          const: CNY
    OriginalReconciliationSource:
      type: object
      additionalProperties: false
      required: [source_kind, source_system, source_label, fact_count, mapped_fact_count, amount_minor]
      properties:
        source_kind:
          type: string
          enum: [POSTED_LEDGER, CONFIRMED_CANDIDATE, ACCOUNT_STATEMENT]
        source_system:
          type: string
          minLength: 1
          maxLength: 100
        source_label:
          type: [string, "null"]
          minLength: 1
          maxLength: 200
        fact_count:
          type: integer
          minimum: 0
        mapped_fact_count:
          type: integer
          minimum: 0
        amount_minor:
          type: integer
          format: int64
    WorkbookDraft:
      type: object
      additionalProperties: false
      required: [id, accounting_month, input_revision, status, verification, monitor_url]
      properties:
        id:
          type: string
          format: uuid
        accounting_month:
          type: string
        input_revision:
          type: integer
        status:
          type: string
          enum: [QUEUED, BUILDING, NEEDS_REVIEW, VERIFIED, FAILED]
        verification:
          type: [string, "null"]
          enum: [LIBREOFFICE_VERIFIED, null]
        monitor_url:
          type: string
          format: uri-reference
        output_sha256:
          type: [string, "null"]
          pattern: "^[a-f0-9]{64}$"
        verification_detail:
          type: [string, "null"]
          maxLength: 2000
    ConnectionStatus:
      type: object
      additionalProperties: false
      required: [id, state, checked_at]
      properties:
        id:
          type: string
          enum: [hermes_ingress, ledgerbridge_core, onedrive_appfolder, libreoffice_worker]
        state:
          type: string
          enum: [CONNECTED, DISCONNECTED, DEGRADED, NOT_CONFIGURED]
        checked_at:
          type: string
          format: date-time
        detail:
          type: string
          maxLength: 500
    Problem:
      type: object
      additionalProperties: true
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        code:
          type: string
        detail:
          type: string
